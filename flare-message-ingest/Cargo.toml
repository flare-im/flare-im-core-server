[package]
name = "flare-message-ingest"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flare-message-ingest"
path = "cmd/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
flare-core = { workspace = true }
flare-server-core = { workspace = true, features = ["proto", "nats", "kafka", "grpc", "discovery"] }
flare-core-runtime = { workspace = true }
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }
futures = { workspace = true }
moka = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
flare-im-contracts = { workspace = true }
flare-im-message-pipeline = { workspace = true }
flare-im-service-kit = { workspace = true }
flare-im-seq = { workspace = true }
flare-im-hooks = { workspace = true }

[features]
default = []

[lints]
workspace = true
