# cargo-audit 的豁免清单（cargo-deny 读的是 deny.toml，两处都要写）。
#
# 只放「查证过确实不影响本项目」的条目，并写清理由与撤销条件。
# 长期红着的审计等于没有审计——基线必须是绿的，红了才有人看。

[advisories]
ignore = [
    # RUSTSEC-2023-0071 rsa: Marvin Attack（5.9 medium，上游至今无修复版本）
    #
    # **本仓不编译 rsa**。lock 里唯一的来路是 sqlx-mysql：sqlx 声明了它，Cargo 把它记进 lock，
    # 而本项目只开 postgres feature。cargo-audit 只读 lock、不做 feature 求解，只能在此豁免；
    # cargo-deny 按 feature 求解后的依赖图检查，图里没有 rsa，所以 deny.toml 不需要这条。
    # （jsonwebtoken 以前开着 rsa 特性，现在走 aws_lc_rs 后端，RS256 由 aws-lc 实现。）
    #
    # 撤销条件：启用 sqlx 的 mysql feature，或任何依赖重新把 rsa 编进来（cargo-deny 会先报出来）。
    # 届时必须删掉这条重新评估。
    "RUSTSEC-2023-0071",
]
