name: Release Gates

on:
  # push 触发是补上的（2026-08-20）：原本只有 pull_request，而本项目是直接推
  # main/dev、不走 PR —— 于是这个 workflow 从建好那天起一次都没执行过。
  # 「写了但永远不触发」比红更隐蔽：Actions 页面上干干净净，什么都看不出来。
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deploy/**"
      - "docs/06-testing-performance-and-operations.md"
      - "scripts/chaos/**"
      - ".github/workflows/release-gates.yml"
  workflow_dispatch:

jobs:
  large-group-primitives:
    name: Large group primitives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 本项目是多仓库结构：workspace 里的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 连 manifest 都解析不了。
      #
      # 这一步是补上的（2026-08-20）。这两个 workflow **从建好那天起就没跑过**：
      # 触发条件只有 pull_request，而本项目是直接推 main/dev、不走 PR。
      # 手动 dispatch 一次才发现它们连 `cargo check` 都到不了——
      # 全部失败在 `failed to read ../flare-core/Cargo.toml`。
      - name: 拉取同级仓库
        working-directory: .
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "../flare-server-core"

      - name: 安装 protoc
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-large-group
      - name: Message pipeline push primitive tests
        run: cargo test -p flare-im-message-pipeline push_only_message_
      - name: Orchestrator large conversation tests
        run: cargo test -p flare-orchestrator large_conversation
      - name: Push server recipient-less ping tests
        run: cargo test -p flare-push-server recipientless_conversation_ping
      - name: Architecture large conversation guards
        run: cargo test -p flare-im-arch-tests large_conversation

  observability-config:
    name: Observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/deploy:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("deploy/grafana/provisioning/dashboards")
          for path in root.rglob("*.json"):
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"valid json: {path}")
          PY

  chaos-dry-run:
    name: Chaos drill dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate chaos drill catalog
        run: bash scripts/chaos/run_release_chaos_drills.sh --dry-run
