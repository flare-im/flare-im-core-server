name: Release Gates

on:
  # push 触发是补上的（2026-08-20）：原本只有 pull_request，而本项目是直接推
  # main/dev、不走 PR —— 于是这个 workflow 从建好那天起一次都没执行过。
  # 「写了但永远不触发」比红更隐蔽：Actions 页面上干干净净，什么都看不出来。
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deploy/**"
      - "release/**"
      - "tools/flare-migrate/**"
      - "docs/06-testing-performance-and-operations.md"
      - "scripts/chaos/**"
      - ".github/workflows/release-gates.yml"
  workflow_dispatch:

jobs:
  core-migrator-image-shape:
    name: Core one-shot migrator image shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the isolated migrator build context
        run: python3 tools/flare-migrate/test_image.py

  core-runtime-image-healthcheck:
    name: Core runtime image healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the supervisor healthcheck and the one-process override
        run: python3 release/tests/test_runtime_image.py

  large-group-primitives:
    name: Large group primitives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 本项目是多仓库结构：workspace 里的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 连 manifest 都解析不了。
      #
      # 这一步是补上的（2026-08-20）。这两个 workflow **从建好那天起就没跑过**：
      # 触发条件只有 pull_request，而本项目是直接推 main/dev、不走 PR。
      # 手动 dispatch 一次才发现它们连 `cargo check` 都到不了——
      # 全部失败在 `failed to read ../flare-im-transport/Cargo.toml`。
      - name: 拉取同级仓库
        working-directory: .
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-im-transport.git "../flare-im-transport"
          clone https://github.com/flare-im/flare-im-protocol.git "../flare-im-protocol"
          clone https://github.com/flare-im/flare-im-plugin-sdk.git "../flare-im-plugin-sdk"
          clone https://github.com/flare-im/flare-im-notify-rules.git "../flare-im-notify-rules"
          clone https://github.com/flare-im/flare-im-protocol-grpc.git "../flare-im-protocol-grpc"
          clone https://github.com/flare-im/flare-im-server-runtime.git "../flare-im-server-runtime"
          clone https://github.com/flare-im/flare-im-core-engine.git "../flare-im-core-engine"

      # 与 ci.yml 的「安装构建依赖」保持同一份清单：rdkafka-sys 会现编 librdkafka，
      # 缺 curl / ssl / zlib / sasl 的开发头就挂在 `#include <curl/curl.h>`。
      # 注意 kafka feature 在每个服务对 flare-server-core 的依赖里都是硬开的，
      # 所以**不跑 kafka 的 job 也要装**——JetStream 那个 job 就是这么失败的。
      - name: 安装构建依赖
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-large-group
      - name: Message pipeline push primitive tests
        run: cargo test -p flare-im-message-pipeline push_only_message_
      - name: Orchestrator large conversation tests
        run: cargo test -p flare-orchestrator large_conversation
      - name: Push server recipient-less ping tests
        run: cargo test -p flare-push-server recipientless_conversation_ping
      - name: Architecture large conversation guards
        run: cargo test -p flare-im-arch-tests large_conversation

  architecture-guards:
    name: Architecture guards (full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arch-tests 自身零依赖，但它是 workspace 成员：cargo 解析 workspace
      # manifest 时所有 path 依赖必须存在，否则 metadata 都拿不到
      # （与 large-group-primitives 的克隆步骤保持同一份清单）。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-im-transport.git "../flare-im-transport"
          clone https://github.com/flare-im/flare-im-protocol.git "../flare-im-protocol"
          clone https://github.com/flare-im/flare-im-plugin-sdk.git "../flare-im-plugin-sdk"
          clone https://github.com/flare-im/flare-im-notify-rules.git "../flare-im-notify-rules"
          clone https://github.com/flare-im/flare-im-protocol-grpc.git "../flare-im-protocol-grpc"
          clone https://github.com/flare-im/flare-im-server-runtime.git "../flare-im-server-runtime"
          clone https://github.com/flare-im/flare-im-core-engine.git "../flare-im-core-engine"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-arch-guards
      # 全量跑：守卫体系的失效方式从来不是「红」而是「没人跑」——
      # panic_boundary 曾因守卫自身盲区红在主干而无人发现，单跑一个
      # 守卫等于把其余 19 条防线挪出了 CI。
      - name: Run every workspace-level architecture guard
        run: cargo test -p flare-im-arch-tests

  observability-config:
    name: Observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # promtool 钉到本地复验用的同一个镜像：v3.14.0 的多架构索引 digest
      # （含 linux/amd64 与 linux/arm64），标签只作说明，拉取以 digest 为准。
      # 原先钉的 v2.55.1 从未在本地跑过；升级 promtool 时先用新镜像本地复验
      # 同一条命令，再改这里的标签与 digest。
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/deploy:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("deploy/grafana/provisioning/dashboards")
          for path in root.rglob("*.json"):
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"valid json: {path}")
          PY

  chaos-dry-run:
    name: Chaos drill dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate chaos drill catalog
        run: bash scripts/chaos/run_release_chaos_drills.sh --dry-run
