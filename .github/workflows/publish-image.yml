name: Legacy image publication disabled

# This workflow used to publish an unpinned, unsigned Core image before its
# smoke test. Keep its old tag/manual entry points as an explicit failing
# guard until the cross-repository, digest-pinned DEP-03 release workflow is
# approved and replaces it. Do not grant packages:write here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-legacy-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refuse the obsolete publication path
        run: |
          echo '::error::Core legacy image publishing is disabled. Use the approved DEP-03 release manifest, pinned source revisions, native amd64/arm64 builds, signing, and pre-publication gates.'
          exit 1
