name: MQ Profiles

# ⚠️ 说明一句实话：这两个 job 目前**编译面是一样的**。
# `kafka` feature 在每个服务对 flare-server-core 的依赖里都是硬开的，
# `cargo check --workspace` 因此总会编 rdkafka，与 FLARE_MQ_DEFAULT_BACKEND 无关
# ——那个环境变量只影响运行时选哪个后端。
# 所以它现在的真实价值是「整个 workspace 带 --locked 编得过」，不是「两套后端各验一遍」。
# 要让这个矩阵名副其实，得先把后端做成 cargo feature；那是独立的一次改造。

on:
  # push 触发是补上的（2026-08-20）：原本只有 pull_request，而本项目是直接推
  # main/dev、不走 PR —— 于是这个 workflow 从建好那天起一次都没执行过。
  # 「写了但永远不触发」比红更隐蔽：Actions 页面上干干净净，什么都看不出来。
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mq-profiles.yml"
  workflow_dispatch:

jobs:
  jetstream:
    name: JetStream profile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      FLARE_MQ_DEFAULT_BACKEND: jetstream
    steps:
      - uses: actions/checkout@v4
      # 本项目是多仓库结构：workspace 里的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 连 manifest 都解析不了。
      #
      # 这一步是补上的（2026-08-20）。这两个 workflow **从建好那天起就没跑过**：
      # 触发条件只有 pull_request，而本项目是直接推 main/dev、不走 PR。
      # 手动 dispatch 一次才发现它们连 `cargo check` 都到不了——
      # 全部失败在 `failed to read ../flare-core/Cargo.toml`。
      - name: 拉取同级仓库
        working-directory: .
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "../flare-server-core"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: mq-jetstream

      # 与 ci.yml 的「安装构建依赖」保持同一份清单：rdkafka-sys 会现编 librdkafka，
      # 缺 curl / ssl / zlib / sasl 的开发头就挂在 `#include <curl/curl.h>`。
      # 注意 kafka feature 在每个服务对 flare-server-core 的依赖里都是硬开的，
      # 所以**不跑 kafka 的 job 也要装**——JetStream 那个 job 就是这么失败的。
      - name: 安装构建依赖
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev
      - name: Check JetStream backend
        run: cargo check --workspace --locked

  kafka:
    name: Kafka profile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      FLARE_MQ_DEFAULT_BACKEND: kafka
    steps:
      - uses: actions/checkout@v4
      # 本项目是多仓库结构：workspace 里的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 连 manifest 都解析不了。
      #
      # 这一步是补上的（2026-08-20）。这两个 workflow **从建好那天起就没跑过**：
      # 触发条件只有 pull_request，而本项目是直接推 main/dev、不走 PR。
      # 手动 dispatch 一次才发现它们连 `cargo check` 都到不了——
      # 全部失败在 `failed to read ../flare-core/Cargo.toml`。
      - name: 拉取同级仓库
        working-directory: .
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "../flare-server-core"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: mq-kafka

      # 与 ci.yml 的「安装构建依赖」保持同一份清单：rdkafka-sys 会现编 librdkafka，
      # 缺 curl / ssl / zlib / sasl 的开发头就挂在 `#include <curl/curl.h>`。
      # 注意 kafka feature 在每个服务对 flare-server-core 的依赖里都是硬开的，
      # 所以**不跑 kafka 的 job 也要装**——JetStream 那个 job 就是这么失败的。
      - name: 安装构建依赖
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev
      - name: Check Kafka backend
        run: cargo check --workspace --locked
