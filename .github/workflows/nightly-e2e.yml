name: Nightly E2E

# 为什么要有这条：
#
# 其余门禁只在有人推代码时跑，也只验编译与单测。但 README 首屏印着
# 「开源栈自足：6/6 通过」—— 这句话的支撑是一整套**跨进程**链路（网关验签 →
# 信令 → 存储 → 同步 → 推送 → E2EE），它会因为依赖漂移、镜像更新、上游行为
# 变化而失效，而这些都不伴随任何一次提交。
#
# 没有定时跑的话，失效要等下一个人提交（可能是几周后）才暴露；更糟的情况是
# 等一个正在评估的人先撞上。所以每天跑一次完整栈，把「那句话现在还成立吗」
# 变成一个每天都有答案的问题。

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）—— 避开工作时段，失败了早上能看到
    - cron: "0 18 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: 全栈端到端（6 项）
    runs-on: ubuntu-latest
    # 起 13 个服务 + 编译整个工作区，给足时间；卡死时也不至于占满额度
    timeout-minutes: 90

    steps:
      - name: 检出 flare-im-core
        uses: actions/checkout@v4
        with:
          path: flare-im-core

      # 用例住在客户端 SDK 仓：冒烟脚本跑的是「SDK 连真实服务端」，
      # 只有服务端这一半的话，验的就只是它自己能不能启动。
      - name: 检出 flare-im-core-sdk
        uses: actions/checkout@v4
        with:
          repository: flare-im/flare-im-core-sdk
          path: flare-im-core-sdk
          ref: dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            flare-im-core
            flare-im-core-sdk

      # 本仓无法单独构建：examples 等成员按**同级目录**依赖 flare-core / flare-proto
      # 等仓（path 依赖）。ci.yml 早有这一步，nightly 漏了 —— 表现为
      # `failed to read ../flare-core/Cargo.toml: No such file or directory`。
      #
      # 注意路径：本工作流把主仓检出到 flare-im-core/ 子目录，所以同级仓要落在
      # 工作区根（即 flare-im-core 的上一级），与本地开发的布局一致。
      - name: 拉取同级仓库
        working-directory: ${{ github.workspace }}
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "flare-core"
          clone https://github.com/flare-im/flare-proto.git "flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "flare-server-core"
          # 不克隆 flare-plugin：它是私有仓，而这条流水线验的是**开源栈**能否自足。
          # RTC 由那个插件提供，因此不属于开源侧的自足证明；示例里那一步会明确
          # 跳过并说明，不再让整例变红。

      # 与 ci.yml 同一套：契约由 .proto 生成，构建期需要 protobuf 编译器；
      # rdkafka-sys 会现场编译 librdkafka（C），需要 curl/sasl/ssl/zlib 开发头文件。
      # 这条此前只写在 ci.yml 里，nightly 漏了 —— 表现为「未找到 protoc 编译器」。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev

      - name: 起基础设施
        working-directory: flare-im-core
        run: |
          # --wait 会等健康检查转绿，并在任一容器退出时直接失败。
          # 只用「端口能连上」判定是不够的：崩溃循环的容器会在重启窗口里
          # 接受一次连接，探测就绿了，然后下一步才发现服务其实不在。
          docker compose -f deploy/docker-compose.yml up -d --wait \
            consul redis postgres nats rustfs

          # 第二道：健康检查是容器自己的视角，这里验从宿主机能否真的连上
          # （端口映射写错时容器照样健康）。
          for svc in "Consul 28500" "Redis 26379" "PostgreSQL 25432" \
                     "NATS 24222" "RustFS 29000"; do
            name="${svc% *}"; port="${svc#* }"
            for i in $(seq 60); do
              nc -z localhost "$port" && break
              [ "$i" = 60 ] && { echo "::error::$name ($port) 60s 内未就绪"; exit 1; }
              sleep 1
            done
            echo "✓ $name ($port)"
          done

      # 失败时留下能定位问题的东西。没有这一步的话，一次红只会告诉你
      # 「某个端口不通」，而真正的原因（镜像启动即退、配置文件缺失）在容器日志里。
      - name: 基础设施诊断（仅失败时）
        if: failure()
        working-directory: flare-im-core
        run: |
          docker compose -f deploy/docker-compose.yml ps -a
          for c in flare-consul flare-redis flare-postgres flare-nats flare-rustfs; do
            echo "===== $c ====="
            docker logs --tail 60 "$c" 2>&1 || echo "(容器不存在)"
          done

      - name: 起 Flare IM Core
        working-directory: flare-im-core
        run: |
          ./scripts/start_server.sh
          ./scripts/check_services.sh

      - name: 开源栈冒烟（6 项）
        working-directory: flare-im-core
        env:
          # 两个仓在 CI 里是并排的兄弟目录，路径与本地开发一致；
          # 显式传入而不是靠默认推断，免得目录布局一改就静默走错。
          FLARE_SDK_ROOT: ${{ github.workspace }}/flare-im-core-sdk
        run: ./scripts/smoke_opensource.sh

      # 能力插件是「装上就能用」这条承诺的全部内容：注册、权限、转发、注销
      # 四处任意一处坏掉都不会有信号——单测覆盖不到跨进程链路。
      # 需要 grpcurl，装它比重写一个 gRPC 客户端便宜。
      - name: 安装 grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin grpcurl

      - name: 能力插件生命周期（5 项）
        working-directory: flare-im-core
        run: ./scripts/smoke_plugin_lifecycle.sh

      # 失败时把日志带出来。端到端失败最耗时的部分是「不知道哪一环断了」，
      # 服务日志能直接指出是验签、编排还是存储。
      - name: 收集日志（仅失败时）
        if: failure()
        run: |
          mkdir -p artifacts
          cp -r flare-im-core/logs artifacts/server-logs 2>/dev/null || true
          cp /tmp/flare-smoke-*.log artifacts/ 2>/dev/null || true
          docker compose -f flare-im-core/deploy/docker-compose.yml logs \
            --tail 200 > artifacts/infra.log 2>&1 || true

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-logs
          path: artifacts/
          retention-days: 7

      - name: 停机
        if: always()
        working-directory: flare-im-core
        run: |
          ./scripts/stop_server.sh || true
          docker compose -f deploy/docker-compose.yml down -v || true
