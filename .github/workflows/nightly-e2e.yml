name: Nightly E2E

# 为什么要有这条：
#
# 其余门禁只在有人推代码时跑，也只验编译与单测。但 README 首屏印着
# 「开源栈自足：6/6 通过」—— 这句话的支撑是一整套**跨进程**链路（网关验签 →
# 信令 → 存储 → 同步 → 推送 → E2EE），它会因为依赖漂移、镜像更新、上游行为
# 变化而失效，而这些都不伴随任何一次提交。
#
# 没有定时跑的话，失效要等下一个人提交（可能是几周后）才暴露；更糟的情况是
# 等一个正在评估的人先撞上。所以每天跑一次完整栈，把「那句话现在还成立吗」
# 变成一个每天都有答案的问题。

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）—— 避开工作时段，失败了早上能看到
    - cron: "0 18 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: 全栈端到端（6 项）
    runs-on: ubuntu-latest
    # 起 13 个服务 + 编译整个工作区，给足时间；卡死时也不至于占满额度
    timeout-minutes: 90

    steps:
      - name: 检出 flare-im-core
        uses: actions/checkout@v4
        with:
          path: flare-im-core

      # 用例住在客户端 SDK 仓：冒烟脚本跑的是「SDK 连真实服务端」，
      # 只有服务端这一半的话，验的就只是它自己能不能启动。
      - name: 检出 flare-im-core-sdk
        uses: actions/checkout@v4
        with:
          repository: flare-im/flare-im-core-sdk
          path: flare-im-core-sdk
          ref: dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            flare-im-core
            flare-im-core-sdk

      - name: 起基础设施
        working-directory: flare-im-core
        run: |
          docker compose -f deploy/docker-compose.yml up -d \
            consul redis postgres nats rustfs
          # 等端口真的能连上，而不是等 compose 返回 —— 容器起来 ≠ 服务就绪
          for svc in "Consul 28500" "Redis 26379" "PostgreSQL 25432" \
                     "NATS 24222" "RustFS 29000"; do
            name="${svc% *}"; port="${svc#* }"
            for i in $(seq 60); do
              nc -z localhost "$port" && break
              [ "$i" = 60 ] && { echo "::error::$name ($port) 60s 内未就绪"; exit 1; }
              sleep 1
            done
            echo "✓ $name ($port)"
          done

      - name: 起 Flare IM Core
        working-directory: flare-im-core
        run: |
          ./scripts/start_server.sh
          ./scripts/check_services.sh

      - name: 开源栈冒烟（6 项）
        working-directory: flare-im-core
        env:
          # 两个仓在 CI 里是并排的兄弟目录，路径与本地开发一致；
          # 显式传入而不是靠默认推断，免得目录布局一改就静默走错。
          FLARE_SDK_ROOT: ${{ github.workspace }}/flare-im-core-sdk
        run: ./scripts/smoke_opensource.sh

      # 失败时把日志带出来。端到端失败最耗时的部分是「不知道哪一环断了」，
      # 服务日志能直接指出是验签、编排还是存储。
      - name: 收集日志（仅失败时）
        if: failure()
        run: |
          mkdir -p artifacts
          cp -r flare-im-core/logs artifacts/server-logs 2>/dev/null || true
          cp /tmp/flare-smoke-*.log artifacts/ 2>/dev/null || true
          docker compose -f flare-im-core/deploy/docker-compose.yml logs \
            --tail 200 > artifacts/infra.log 2>&1 || true

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-logs
          path: artifacts/
          retention-days: 7

      - name: 停机
        if: always()
        working-directory: flare-im-core
        run: |
          ./scripts/stop_server.sh || true
          docker compose -f deploy/docker-compose.yml down -v || true
