name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "../flare-server-core"
          # 文档命令门禁要判定 example 归属（e2ee_demo 在客户端 SDK 仓）。
          # 不克隆它的话门禁会把「仓没检出」误报成「example 不存在」。
          clone https://github.com/flare-im/flare-im-core-sdk.git "../flare-im-core-sdk"
          # README 数字门禁要数平台 SDK 与 UI 组件。缺了这两个仓，
          # 门禁会「跳过」而不是「通过」——等于白接。浅克隆，代价很小。
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"
          clone https://github.com/flare-im/flare-im-design.git "../flare-im-design"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 契约由 .proto 生成，构建期需要 protobuf 编译器；
      # rdkafka-sys 会现场编译 librdkafka（C），需要 curl/sasl/ssl/zlib 开发头文件，
      # 缺 curl/curl.h 时表现为 clippy 步骤失败，容易误判成 lint 问题。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev


      # 文档里的命令要真能跑。这类失效已经出现两次（mint_token / e2ee_demo
      # 都在同级仓，却被写成本仓可直接执行的样子），且都在新人最先读的文档里。
      - name: 文档命令与仓库一致
        run: ./scripts/check_doc_commands.sh

      # README 首屏那几个具体数字（平台 SDK 数、UI 组件数）是评估者最先核对的，
      # 也最容易随时间变假——加一个平台、删一个组件，没有任何机制提醒你回来改。
      # 数字对不上不会让任何测试变红，但会让读的人开始怀疑其余内容。
      - name: README 数字与仓库一致
        run: ./scripts/check_readme_numbers.sh

      # 格式先查：最快，失败得早，省掉后面的编译时间
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  # 供应链审计与主流程解耦：advisory DB 每天在变，
  # 不该因为上游新披露的 CVE 就让无关的功能 PR 变红。
  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "../flare-server-core"
          # 文档命令门禁要判定 example 归属（e2ee_demo 在客户端 SDK 仓）。
          # 不克隆它的话门禁会把「仓没检出」误报成「example 不存在」。
          clone https://github.com/flare-im/flare-im-core-sdk.git "../flare-im-core-sdk"
          # README 数字门禁要数平台 SDK 与 UI 组件。缺了这两个仓，
          # 门禁会「跳过」而不是「通过」——等于白接。浅克隆，代价很小。
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"
          clone https://github.com/flare-im/flare-im-design.git "../flare-im-design"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 契约由 .proto 生成，构建期需要 protobuf 编译器；
      # rdkafka-sys 会现场编译 librdkafka（C），需要 curl/sasl/ssl/zlib 开发头文件，
      # 缺 curl/curl.h 时表现为 clippy 步骤失败，容易误判成 lint 问题。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev


      - name: 安装 cargo-audit / cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit（已知漏洞）
        run: cargo audit

      - name: cargo deny（许可 / 来源 / 重复依赖）
        run: cargo deny check
