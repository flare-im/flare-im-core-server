name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "../flare-server-core"
          # 文档命令门禁要判定 example 归属（e2ee_demo 在客户端 SDK 仓）。
          # 不克隆它的话门禁会把「仓没检出」误报成「example 不存在」。
          clone https://github.com/flare-im/flare-im-core-sdk.git "../flare-im-core-sdk"
          # README 数字门禁要数平台 SDK 与 UI 组件。缺了这两个仓，
          # 门禁会「跳过」而不是「通过」——等于白接。浅克隆，代价很小。
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"
          clone https://github.com/flare-im/flare-im-design.git "../flare-im-design"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 契约由 .proto 生成，构建期需要 protobuf 编译器；
      # rdkafka-sys 会现场编译 librdkafka（C），需要 curl/sasl/ssl/zlib 开发头文件，
      # 缺 curl/curl.h 时表现为 clippy 步骤失败，容易误判成 lint 问题。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev


      # 文档里的命令要真能跑。这类失效已经出现两次（mint_token / e2ee_demo
      # 都在同级仓，却被写成本仓可直接执行的样子），且都在新人最先读的文档里。
      - name: 文档命令与仓库一致
        run: ./scripts/check_doc_commands.sh

      # README 首屏那几个具体数字（平台 SDK 数、UI 组件数）是评估者最先核对的，
      # 也最容易随时间变假——加一个平台、删一个组件，没有任何机制提醒你回来改。
      # 数字对不上不会让任何测试变红，但会让读的人开始怀疑其余内容。
      - name: README 数字与仓库一致
        run: ./scripts/check_readme_numbers.sh

      # Hook 契约文档是外部作者照着实现的依据。文档多写一个 operation，
      # 照做的人永远收不到调用；适配器多派发一个而文档没写，外部作者
      # 根本不知道有这个扩展点。两个方向都没有运行时信号。
      - name: Hook 契约文档与适配器一致
        run: ./scripts/check_hook_contract.sh

      # 格式先查：最快，失败得早，省掉后面的编译时间
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  # 供应链审计与主流程解耦：advisory DB 每天在变，
  # 不该因为上游新披露的 CVE 就让无关的功能 PR 变红。
  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          clone https://github.com/flare152/flare-server-core.git "../flare-server-core"
          # 文档命令门禁要判定 example 归属（e2ee_demo 在客户端 SDK 仓）。
          # 不克隆它的话门禁会把「仓没检出」误报成「example 不存在」。
          clone https://github.com/flare-im/flare-im-core-sdk.git "../flare-im-core-sdk"
          # README 数字门禁要数平台 SDK 与 UI 组件。缺了这两个仓，
          # 门禁会「跳过」而不是「通过」——等于白接。浅克隆，代价很小。
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"
          clone https://github.com/flare-im/flare-im-design.git "../flare-im-design"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 契约由 .proto 生成，构建期需要 protobuf 编译器；
      # rdkafka-sys 会现场编译 librdkafka（C），需要 curl/sasl/ssl/zlib 开发头文件，
      # 缺 curl/curl.h 时表现为 clippy 步骤失败，容易误判成 lint 问题。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler cmake pkg-config \
            libcurl4-openssl-dev libsasl2-dev libssl-dev zlib1g-dev


      - name: 安装 cargo-audit / cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit（已知漏洞）
        run: cargo audit

      - name: cargo deny（许可 / 来源 / 重复依赖）
        run: cargo deny check

  # 部署文档是使用者接触本项目的第一步，而它腐坏时**没有任何信号**：
  # 改了 compose 文件名、删了某一层、换了变量名，测试全绿、CI 全绿，
  # 只有照着做的人卡在第一条命令。
  #
  # 本仓吃过同类的亏：docker-compose.stack.yml 默认指向一个**从未发布过**的镜像，
  # 于是里面积了库名写错（连的 /flare、实际建的是 flare2）、中间件地址硬编码
  # （14 个服务会去连自己容器的 localhost）等好几处，直到真去跑才暴露。
  deploy-docs:
    name: 部署文档与 compose 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # runner 自带 docker，无需额外安装；这道门禁只跑 `docker compose config`，
      # 不拉镜像、不起容器，十几秒即可。
      - name: 校验部署文档
        run: ./scripts/check_deploy_docs.sh

      # 池上限与 postgres max_connections 分别维护，对不上时的故障形态是
      # 发消息静默失败（日志里还是 outcome=ok），只有这里能提前发现。
      - name: 校验数据库连接预算
        run: ./scripts/check_pg_connection_budget.sh

      # init.sql 与 migrations/ 各写一份同一个索引却用了不同的名字时，
      # IF NOT EXISTS 去重不掉，跑过迁移的库会建出两份完全相同的索引：
      # 查询只用一个，写入维护两个。线上实测撞到两处。
      - name: 校验重复索引
        run: ./scripts/check_duplicate_indexes.sh

      # allkeys-lru 会淘汰不带 TTL 的会话 seq 高水位键，导致 seq 回退、
      # 时间线永久错乱。这类故障零信号，只在内存吃紧时才爆发。
      - name: 校验 Redis 淘汰策略
        run: ./scripts/check_redis_eviction_policy.sh

      # 注册进 Prometheus 却没人写的指标，/metrics 里永远是 0。
      # 运维在故障时看到 push_success_total 0 会断定"推送全挂"，
      # 而实际推送好好的——比压根没有这个指标更糟。
      - name: 校验死指标
        run: ./scripts/check_dead_metrics.sh

      # 网关曾经注册了指标、还打了 "Prometheus metrics initialized" 日志，
      # 却从没调用 serve_prometheus_metrics——指标有人写有人注册，就是没出口。
      - name: 校验指标端点已暴露
        run: ./scripts/check_metrics_endpoint_served.sh
