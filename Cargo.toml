[workspace]
members = [
    # 可运行示例：不进 workspace 就无法 cargo run --example
    "examples",
    # IM shared crates - explicit dependency boundaries
    "crates/flare-im-contracts",
    "crates/flare-im-service-kit",
    "crates/flare-im-message-pipeline",
    "crates/flare-im-seq",
    "crates/flare-im-ack",
    "crates/flare-im-hooks",
    "crates/flare-im-capability-core",
    "crates/flare-call",
    
    # 通信核心层 - 统一网关
    "flare-api-gateway",
    "flare-admin-gateway",
    
    # 通信核心层 - 信令系统
    "flare-signaling/gateway",
    "flare-signaling/online",
    "flare-signaling/route",
    
    # 通信核心层 - 推送系统
    "flare-push/proxy",
    "flare-push/server",
    "flare-push/worker",
    
    # 通信核心层 - 存储系统
    "flare-storage/writer",
    "flare-storage/reader",
    "flare-conversation",
    "flare-sync-orchestrator",

    "flare-message-ingest",
    "flare-orchestrator",
    
    # Hook 引擎 + 能力插件（capability）
    "flare-capability",

    # 媒体服务
    "flare-media",

    # 架构守卫测试
    "arch-tests",

    # 运维工具
    "tools/flare-dlq-replay",
]

resolver = "2"

# 领域层的仓储端口（trait）统一用 `async fn`，不套 #[async_trait] 的装箱开销。
# `async_fn_in_trait` 提示的是「调用方无法为返回的 future 指定 Send 等 auto trait
# 约束」——这些 trait 只在本工作区内部被 tokio 多线程执行器消费，实现方全部是
# Send 的，不存在被外部以其它执行器消费的场景，因此该提示在这里不适用。
# 若将来把某个 trait 作为公共 SDK 契约导出，应改回 #[async_trait] 并移除此处豁免。
[workspace.lints.rust]
async_fn_in_trait = "allow"

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"

[workspace.dependencies]
# 错误处理
anyhow = "1.0"

# Base64 支持
base64 = "0.22"

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"

# gRPC
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.18"

# 消息队列

# 认证
# 只开实际用到的算法，不用 rust_crypto 聚合特性——后者还会拉进
# ed25519-dalek / p384 / rand，全是用不上的攻击面。
# 用到的两处：APNs 走 ES256（p256），FCM 的服务账号 OAuth JWT 走 RS256（rsa）。
jsonwebtoken = { version = "10.2", default-features = false, features = [
    "p256",
    "rsa",
    "sha2",
] }

# 工具
bytes = "1"
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
# 加密和哈希
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
hmac = "0.12"
md5 = "0.7"
# ULID 生成
ulid = "1.1"

# Service Mesh 和中间件
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum = "0.8"

# etcd 客户端
etcd-client = "0.17"

# Flare Core
flare-core = { version = "1.0.3", path = "../flare-core" }

# Flare Server Core (启用 proto feature 以使用错误转换函数)
flare-server-core = { version = "1.0.3", path = "../flare-server-core", features = ["proto", "grpc", "http"] }
flare-core-base = { version = "1.0.3", path = "../flare-server-core/flare-core-base" }
flare-core-messaging = { version = "1.0.3", path = "../flare-server-core/flare-core-messaging" }
flare-core-runtime = { version = "1.0.3", path = "../flare-server-core/flare-core-runtime" }

# Flare IM shared crates
flare-im-contracts = { version = "1.0.3", path = "crates/flare-im-contracts" }
flare-im-service-kit = { version = "1.0.3", path = "crates/flare-im-service-kit" }
flare-im-message-pipeline = { version = "1.0.3", path = "crates/flare-im-message-pipeline" }
flare-im-seq = { version = "1.0.3", path = "crates/flare-im-seq" }
flare-im-ack = { version = "1.0.3", path = "crates/flare-im-ack" }
flare-im-hooks = { version = "1.0.3", path = "crates/flare-im-hooks" }
flare-im-capability-core = { version = "1.0.3", path = "crates/flare-im-capability-core" }
flare-call = { version = "1.0.3", path = "crates/flare-call" }

# Flare Proto
flare-proto = { version = "2.0.0", path = "../flare-proto" }
# 2.2.0 起 RegisterPluginEndpointRequest / RegisteredPluginInstance 带上了
# 注册契约 v2 字段（版本、清单摘要、声明的 operation）。本仓的注册与分发
# 直接用这些字段，所以约束必须是 2.2 而不是 2.0——否则 published 构建会
# 从 registry 拿到没有这些字段的旧版本，编译期才炸。
flare-grpc-proto = { version = "2.2.0", path = "../flare-grpc-proto" }

# Prometheus 指标收集
prometheus = "0.14"

# 时间和时区
chrono-tz = "0.9"

# URL 处理
url = "2.5"

# AWS SDK (用于对象存储)
# 关掉 s3 的默认 "rustls" 特性：它映射到 aws-smithy-http-client/legacy-rustls-ring，
# 会拉进 rustls 0.21 + rustls-webpki 0.101（多条 RUSTSEC 未修复公告）。
# default-https-client 走的是现代的 rustls-aws-lc，功能等价且在维护中。
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }
aws-config = "1"

# 测试工具
tokio-test = "0.4"

# 新增的依赖，用于统一管理
parking_lot = "0.12"
image = "0.24"
moka = { version = "0.12", features = ["future"] }


# release profile。
#
# 之前完全没配，用 cargo 默认。加这几项的实测收益要说清楚，别夸大：
#   strip = true      最终二进制 18.4MB → 去符号，只影响产物不影响构建峰值
#   incremental=false release 本就默认关闭，显式写出来防止有人误开
#   codegen-units=16  cargo 的 release 默认值，写出来是为了防止有人改小
#                     （改成 1 会显著拉长编译时间，而这台机器已经很紧张）
#
# ⚠️ 这些**解决不了**生产机装不下构建的问题。实测 target/release 共 1857MB，
# 其中 deps 占 1697MB（786 个依赖 crate 的 .rlib 905MB + .rmeta 698MB），
# 那是编译过程的必需中间态，任何 profile 配置都消不掉。
# 构建必须放在别的机器上，见 release/README.md。
#
# 注意：**不设** panic = "abort"。服务端多处依赖 panic 展开后由 tokio 任务边界
# 捕获，只让单个任务失败而不是整进程退出；改成 abort 会把"一个请求处理出错"
# 变成"整个服务挂掉"，这是语义变更，不能为了省磁盘顺手加上。
[profile.release]
strip = true
codegen-units = 16
incremental = false

# 需要符号表排查线上崩溃时用这个，别去动上面的 release。
[profile.release-debug]
inherits = "release"
strip = false
debug = 1
