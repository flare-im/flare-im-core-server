# Flare Capability（Hook + Capability gRPC）
# 与 storage 共用同一数据库，但使用独立 pool profile；可用 DATABASE_URL 覆盖

[services.capability]
postgres = "capability"

[services.capability.server]
address = "0.0.0.0"
port = 50110

[capability_runtime]
plugin_call_timeout_ms = 5000
plugin_health_check_interval_secs = 15
# RegisterPluginEndpoint 的登记存在 capability_plugin_endpoints 表里：各实例按此周期重读，
# 超过 TTL 既没重新登记也没通过一次健康检查的登记被清理（配置发现的端点不入库、不清理）。
plugin_route_refresh_secs = 10
plugin_route_ttl_secs = 86400

# 插件 endpoint 仅登记 discovery 路由，启动时不拨号；Dispatch 时再经 Consul 解析。
[[capability_runtime.plugin_discovery_endpoints]]
tenant_id = "0"
plugin_id = "flare-strom-sfu"
capability_id = "rtc.media.control"
service_name = "flare-strom-sfu"

# 本地静态 SFU（无 Consul）时可改用：
# FLARE_MEDIA_CONTROL_GRPC_ENDPOINT=http://127.0.0.1:50060

# Prometheus 出口（共享运行时挂载；端口表见 deploy/prometheus.yml）。
[services.capability.metrics]
address = "0.0.0.0"
port = 19189
