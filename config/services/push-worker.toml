# Push Worker 服务配置：消费 Push Server 分流后的在线/离线推送任务。

[services.push_worker]
jetstream = "push"
consumer_group = "push-worker"
push_online_topic = "flare.im.push.online"
push_offline_topic = "flare.im.push.offline"
push_dlq_topic = "flare.im.push.dlq"
offline_parking_capacity = 4096
hook_config = "config/hooks.toml"
# hook_config_dir = "config/hooks.d"
metrics_enabled = true
metrics_address = "0.0.0.0"
metrics_port = 19186
metrics_path = "/metrics"

# 离线推送 outbox（Redis Stream 持久化暂存，厂商通道接入前不丢任务）:
#   PUSH_WORKER_OFFLINE_REDIS_URL      默认取 [redis.push] profile 或 redis://127.0.0.1:6379；设为 off 禁用
#   PUSH_WORKER_OFFLINE_OUTBOX_STREAM  默认 flare:im:push:offline:outbox
#   PUSH_WORKER_OFFLINE_OUTBOX_MAXLEN  默认 100000（MAXLEN ~ 近似裁剪）
