# API Gateway 服务配置（业务系统和三方 HTTP facade）

[services.api_gateway]

# Route 服务配置（可选，用于通过 Route 服务路由业务请求）
# 默认不使用 Route 服务，保持 API Gateway 薄转发边界
# use_route_service = false
# route_service = "signaling-route"
# default_svid = "svid.im"

# JWT Token 配置
# token_secret 不应写入仓库。生产/联调用 FLARE_API_GATEWAY_TOKEN_SECRET 注入，长度至少 32 字节。
token_issuer = "flare-im-core"
token_ttl_seconds = 3600

# 联调默认业务登录 token 与 API Gateway issuer/secret 一致，无需额外 trusted issuer。
# 若生产使用独立业务 JWT，可取消注释：
# [[services.api_gateway.trusted_token_issuers]]
# issuer = "business-auth"
# secret = "set-via-secret-manager"

# 跨地区网关路由配置
# 支持多网关部署：通过服务发现自动发现所有 Access Gateway 实例
# Gateway Router 会根据 gateway_id 标签自动路由

[services.api_gateway.server]
address = "0.0.0.0"
port = 50050

# 下游 gRPC：默认 discovery:// 服务发现；本地无注册中心时用 scoped *_STATIC_FALLBACK
# 可通过环境变量覆盖：FLARE_API_GATEWAY_GRPC_*_SERVICE_URL / FLARE_API_GATEWAY_GRPC_*_STATIC_FALLBACK
[services.api_gateway.grpc]
message_ingest_service_url = "discovery://flare-message-ingest"
message_orchestrator_service_url = "discovery://flare-orchestrator"
conversation_service_url = "discovery://flare-conversation"
media_service_url = "discovery://flare-media"
message_ingest_static_fallback = "http://127.0.0.1:50182"
message_orchestrator_static_fallback = "http://127.0.0.1:50181"
conversation_static_fallback = "http://127.0.0.1:50090"
media_static_fallback = "http://127.0.0.1:60081"
