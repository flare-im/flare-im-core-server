# Signaling Route 服务配置
#
# 配置说明：
# - 服务注册配置继承自 base.toml 的 [registry]
# - 路由表存储位置通过环境变量配置（可选）

[services.signaling_route]

# 默认业务服务端点（可选，可通过环境变量覆盖）
# 格式: SERVICE_ID=ENDPOINT
# 示例环境变量：
#   BUSINESS_SERVICE_IM_ENDPOINT=http://localhost:50091
#   BUSINESS_SERVICE_CS_ENDPOINT=http://localhost:50092

[services.signaling_route.server]
address = "0.0.0.0"
port = 50062

# 客户端送达 ACK 由 route 转发至 Push Proxy gRPC。
# 无注册中心时默认回退 http://127.0.0.1:50090（与 push-proxy 默认监听一致）。
# 生产环境请设置环境变量：PUSH_PROXY_GRPC_ENDPOINT=http://push-proxy:50090

