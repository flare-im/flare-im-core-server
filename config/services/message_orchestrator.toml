# Message Orchestrator 服务配置（事件总线：消息流、操作事件流、推送流）
# Kafka 使用 base.toml 中 [kafka.message]；Topic 与 flare_im_core::constants::topics 对齐

[services.message_orchestrator]
kafka = "message"
# 消息流 / 操作事件流 / 推送流 Topic（不配则用 topics 默认值）
storage_topic = "flare.im.message.created"
operation_topic = "flare.im.message.events"
push_topic = "flare.im.push.tasks"
wal_store = "message_wal"
wal_hash_key = "flare:message:wal"
wal_ttl_seconds = 86400
hook_config = "config/hooks.toml"
# hook_config_dir = "config/hooks.d"

[services.message_orchestrator.server]
address = "0.0.0.0"
port = 50081
