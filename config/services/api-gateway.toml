# API Gateway 服务配置（业务系统和三方 HTTP facade）

[services.api_gateway]

# Route 服务配置（可选，用于通过 Route 服务路由业务请求）
# 默认不使用 Route 服务，保持 API Gateway 薄转发边界
# use_route_service = false
# route_service = "signaling-route"
# default_svid = "svid.im"

# JWT Token 配置
# token_secret 不应写入仓库。生产/联调用 FLARE_API_GATEWAY_TOKEN_SECRET 注入，长度至少 32 字节。
token_issuer = "flare-im-core"
token_ttl_seconds = 3600

# 与 Access Gateway 共用 Core tenants 投影；已知 suspended/deleting 租户拒签发、
# 拒刷新、拒普通 API。生产配置 strict；Core-only 联调可用 lenient。
# 可用 FLARE_API_GATEWAY_TENANT_RUNTIME_POSTGRES_URL / FLARE_API_GATEWAY_TENANT_POLICY 覆盖。
postgres = "tenant_runtime"
tenant_policy = "lenient"

# 联调默认业务登录 token 与 API Gateway issuer/secret 一致，无需额外 trusted issuer。
# 若生产使用独立业务 JWT，可取消注释：
# [[services.api_gateway.trusted_token_issuers]]
# issuer = "business-auth"
# secret = "set-via-secret-manager"

# 跨地区网关路由配置
# 支持多网关部署：通过服务发现自动发现所有 Access Gateway 实例
# Gateway Router 会根据 gateway_id 标签自动路由

[services.api_gateway.server]
address = "0.0.0.0"
port = 50050

# 下游 gRPC 默认走 discovery:// 服务发现。
# 本地静态回退或跨环境路由使用作用域环境变量：
#   FLARE_API_GATEWAY_GRPC_*_SERVICE_URL
#   FLARE_API_GATEWAY_GRPC_*_STATIC_FALLBACK
# 显式 static 注册模式（FLARE_REGISTRY_MODE=static，单容器 Core）不做服务发现：启动时
# 每个下游打印一条回退 WARN，然后使用 *_STATIC_FALLBACK 的缺省值，即同一 Core 容器内的固定地址：
#   MEDIA http://127.0.0.1:60081            MESSAGE_INGEST http://127.0.0.1:50182
#   MESSAGE_ORCHESTRATOR http://127.0.0.1:50181   CONVERSATION http://127.0.0.1:50090
#   ONLINE http://127.0.0.1:50061           STORAGE_READER http://127.0.0.1:60083
# 把对应的 FLARE_API_GATEWAY_GRPC_<下游>_SERVICE_URL 设成 http:// 地址即直接连接，不再先尝试
# 发现；下游不在同一容器时填它的私网地址。见 release/README.md「DEP-08 单容器静态发现候选」。
# 设备推送令牌接口直连 Push Proxy 的静态地址（不走服务发现）：
#   FLARE_API_GATEWAY_GRPC_PUSH_PROXY_URL，缺省 http://127.0.0.1:50091（single 拓扑同容器）
# 接入 token 由网关签发/刷新（/api/v1/auth/tokens）。开关与凭据只走环境变量：
# FLARE_API_GATEWAY_AUTH_DEV_ISSUE / AUTH_APP_CREDENTIALS / AUTH_REFRESH_GRACE_SECS / AUTH_HOOK_ISSUE_URL

# Prometheus 出口（共享运行时挂载；端口表见 deploy/prometheus.yml）。
[services.api_gateway.metrics]
address = "0.0.0.0"
port = 19187
