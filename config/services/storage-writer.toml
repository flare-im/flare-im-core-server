# Storage Writer 服务配置（事件总线：消费消息流 + 操作事件流）
# JetStream 使用 base.toml 中 [jetstream.message]；Subject 与 flare_im_core::constants::topics 对齐

[services.storage_writer]

jetstream = "message"
consumer_group = "storage-writer"
# 消息流 / 操作事件流 Subject（不配则用 topics 默认值）
message_subject = "flare.im.message.storage"
operation_subject = "flare.im.message.events"

# PostgreSQL 配置（可选，用于归档）
postgres = "media"

# Redis 配置（WAL 存储）：引用 base.toml 中的 redis.message_wal
wal_store = "message_wal"
wal_hash_key = "flare:message:wal"
wal_ttl_seconds = 86400

# 批量写入配置
batch_size = 1000
batch_interval_ms = 100

# 注意：此服务不提供 gRPC 接口，仅作为 JetStream 消费者运行

