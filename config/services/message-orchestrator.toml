# Message Orchestrator 服务配置（事件总线：消息流、操作事件流、推送流）
# JetStream 使用 base.toml 中 [jetstream.message]；Subject 与 flare_im_contracts::constants::topics 对齐

[services.message_orchestrator]
jetstream = "message"
# 消息流 / 操作事件流 / 推送流 Subject（不配则用 topics 默认值）
storage_subject = "flare.im.message.storage"
operation_subject = "flare.im.message.events"
push_subject = "flare.im.push.messages"
message_dlq_topic = "flare.im.message.main.dlq"
message_retry_topic = "flare.im.message.main.retry.5s"
message_retry_delay_ms = 5000
redis_store = "message_wal"
hook_config = "config/hooks.toml"
# hook_config_dir = "config/hooks.d"
metrics_enabled = true
metrics_address = "0.0.0.0"
metrics_port = 19181
metrics_path = "/metrics"

# 默认 50181：50081 常被本机 VS Code/Cursor Gradle 语言服务占用（127.0.0.1:50081），
# 与 Consul 注册 127.0.0.1 时会导致 Route 连错进程（SendMessage Unimplemented）。
[services.message_orchestrator.server]
address = "0.0.0.0"
port = 50181
