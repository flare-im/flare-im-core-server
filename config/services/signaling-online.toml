# Signaling Online 服务配置
#
# 配置说明：
# - Redis 配置通过 redis 字段引用 base.toml 中的 redis.conversation_store
# - 所有基础设施配置都在 base.toml 中定义，services 只引用名称

[services.signaling_online]

# Redis 配置：引用 base.toml 中的 redis.conversation_store
redis = "conversation_store"

# 在线状态配置
online_ttl_seconds = 3600
presence_prefix = "presence:user"

# 租户在线索引 tenant:sessions:{tenant}（SET of "{user}:{device}"）与 session:{user} 同 TTL 续期；
# KickTenant 按它分页踢出，并向网关的撤销即断频道 `{redis.token_store.namespace}:kick` 发用户 ID
# 让 signaling-gateway 关掉 socket。可用 SIGNALING_ONLINE_KICK_REDIS_URL / SIGNALING_ONLINE_KICK_CHANNEL 覆盖。

[services.signaling_online.server]
address = "0.0.0.0"
port = 50061

