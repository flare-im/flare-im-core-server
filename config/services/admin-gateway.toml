# Admin Gateway 服务配置（内网管理 API 入口）

[services.admin_gateway]

# Admin Gateway 是独立管理面入口，不提供管理后台页面。
# 生产建议部署在内网、VPN、mTLS 或 service mesh policy 后面。

# 管理请求只接受 Control Plane EdDSA 短期令牌。
# 启动时必须通过 FLARE_CONSOLE_PUBLIC_KEY 注入 Ed25519 公钥；无 HMAC 或
# api-gateway 用户令牌回退。私钥只在 Control 后端，不能注入本服务。
# 本地 scripts/start_server.sh 在配置公钥时才启动该服务，并通过
# FLARE_ADMIN_GATEWAY_BIND_ADDRESS=127.0.0.1:50051 默认仅监听环回地址；
# Compose 按私有服务网络使用下方地址，不向公网发布端口。

[services.admin_gateway.server]
address = "0.0.0.0"
port = 50051

# 下游 gRPC 默认走 discovery:// 服务发现；覆盖时使用 Admin Gateway 独立环境变量：
# FLARE_ADMIN_GATEWAY_GRPC_MESSAGE_INGEST_SERVICE_URL
# FLARE_ADMIN_GATEWAY_GRPC_MESSAGE_ORCHESTRATOR_SERVICE_URL
# FLARE_ADMIN_GATEWAY_GRPC_CONVERSATION_SERVICE_URL
# FLARE_ADMIN_GATEWAY_GRPC_MEDIA_SERVICE_URL
# FLARE_ADMIN_GATEWAY_GRPC_ONLINE_SERVICE_URL
# FLARE_ADMIN_GATEWAY_GRPC_STORAGE_READER_SERVICE_URL
# 以及各自 FLARE_ADMIN_GATEWAY_*_STATIC_FALLBACK。
# 显式 static 注册模式（FLARE_REGISTRY_MODE=static，单容器 Core）不做服务发现：启动时
# 每个下游打印一条回退 WARN，然后使用 *_STATIC_FALLBACK 的缺省值，即同一 Core 容器内的固定地址：
#   MEDIA http://127.0.0.1:60081            MESSAGE_INGEST http://127.0.0.1:50182
#   MESSAGE_ORCHESTRATOR http://127.0.0.1:50181   CONVERSATION http://127.0.0.1:50090
#   ONLINE http://127.0.0.1:50061           STORAGE_READER http://127.0.0.1:60083
# 把对应的 *_SERVICE_URL 设成 http:// 地址即直接连接，不再先尝试发现；下游不在同一容器时
# 填它的私网地址。见 release/README.md「DEP-08 单容器静态发现候选」。

# Prometheus 出口（共享运行时挂载；端口表见 deploy/prometheus.yml）。
[services.admin_gateway.metrics]
address = "0.0.0.0"
port = 19188
