# Signaling Gateway 服务配置（原 Access Gateway，位于 flare-signaling/gateway）

[services.access_gateway]
# core_jwt 模式下 token_secret 不应写入仓库。生产/联调用 ACCESS_GATEWAY_TOKEN_SECRET 注入，长度至少 32 字节。
token_issuer = "flare-im-core"
token_ttl_seconds = 3600
token_store = "token_store"

# 联调默认 Social [auth] 已与上方主 issuer/secret 一致，无需额外 trusted issuer。
# 若生产仍使用独立 Social JWT（issuer=flare-social），可取消注释：
# [[services.access_gateway.trusted_token_issuers]]
# issuer = "flare-social"
# secret = "set-via-secret-manager"

# Route 服务配置（生产推荐开启，用于 SVID 路由）
# use_route_service = true
# route_service = "signaling-route"
# default_svid = "svid.im"

# 跨地区网关路由配置（可选）
# gateway_id = "gateway-beijing-1"  # 如果不设置，会自动生成
# region = "beijing"  # 网关所在地区

# 压缩和加密配置
compression_algorithm = "gzip"  # 可选值: none, gzip, zstd（默认: none）
enable_encryption = false  # 是否启用加密（默认: false）
encryption_key = "01234567890123456789012345678901"  # 32字节密钥或64字符hex字符串（请在生产环境中修改为安全的密钥）

# 租户投影（控制面 → 核 tenants 表）：token 合法后再看租户状态。
# postgres 指向 base.toml 的 [postgres.tenant_runtime]（可用 ACCESS_GATEWAY_TENANT_RUNTIME_POSTGRES_URL 覆盖）；
# 不配置则不校验租户状态、sync 配额回落全局阈值。
postgres = "tenant_runtime"
# 未知租户（本地无投影）策略：lenient = 放行（默认，单租户/开发无需先推投影）；strict = 拒绝（生产），
# strict 下投影库不可达也拒绝。suspended / deleting 的租户在两种策略下都拒绝，错误码 TENANT_UNAVAILABLE。
# 可用 ACCESS_GATEWAY_TENANT_POLICY 覆盖。
tenant_policy = "lenient"

# Sync 拉取限流（tenant + user 双令牌桶，防登录风暴叠加大群 ping 拉取风暴）
# 租户阈值先取投影 quota.core.sync_pull_qps（0 = 回落下面的全局 tenant 值）
# sync_pull_rate_limit_enabled = true
# sync_pull_user_requests_per_second = 20
# sync_pull_user_burst = 60
# sync_pull_tenant_requests_per_second = 2000
# sync_pull_tenant_burst = 5000

[services.access_gateway.auth]
# 可选值: core_jwt, http_hook
mode = "core_jwt"
hook_timeout_ms = 800
hook_secret_header = "x-flare-auth-hook-secret"
# http_hook 模式启用：
# hook_url = "http://flare-auth-sidecar:8080/internal/auth/validate"
# hook_secret = "set-via-secret-manager"

[services.access_gateway.server]
address = "0.0.0.0"
port = 60051
