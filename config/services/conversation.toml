# Conversation 服务配置
#
# 配置说明：
# - Redis 配置通过 redis 字段引用 base.toml 中的 redis.conversation_store
# - PostgreSQL 配置通过 postgres 字段引用 base.toml 中的 postgres.media（如果存在）
# - 配置 JetStream 后启用 ReadReceipt 消费者（未读数零成本），引用 base.toml 中 [jetstream.message]

[services.conversation]

redis = "conversation_store"

# 事件总线：配置后消费 operation subject 中的 ReadReceipt，更新未读数（与 Storage Writer 同 subject、不同 group）
jetstream = "message"
operation_subject = "flare.im.message.events"
consumer_group = "conversation-read-receipt"

# PostgreSQL 配置（可选，用于会话元数据存储）：引用 base.toml 中的 postgres.conversation
# 如果未配置，将只使用 Redis（仅支持状态和光标操作）
postgres = "conversation"

# Redis Key 前缀配置
conversation_state_prefix = "storage:conversation:state"
conversation_unread_prefix = "storage:conversation:unread"
user_cursor_prefix = "storage:user:cursor"
presence_prefix = "presence:user"
large_conversation_precise_unread_threshold = 500

# 消息存储服务配置（可选）
# 如果配置了，将启用消息同步功能
# 通过服务发现自动获取服务地址；设了 CONVERSATION_STORAGE_READER_SERVICE_URL（http:// 或 https://）
# 就直连该地址、不做服务发现（单容器 static 模式由 release/supervise-core.toml 写成
# http://127.0.0.1:60083）。旧变量 STORAGE_READER_GRPC_ADDR（host:port）仍兼容但会告警；
# 两者都没设、也没有服务发现时，启动时告警一次并直连 http://127.0.0.1:60083。

# 会话引导配置
recent_message_limit = 20  # 最近消息数量限制

# 默认会话策略
[services.conversation.default_policy]
# 冲突解决策略: exclusive, platform_exclusive, coexist, force_logout
conflict_resolution = "coexist"
max_devices = 5  # 最大设备数，0 表示无限制
allow_anonymous = false  # 是否允许匿名用户
allow_history_sync = true  # 是否允许历史同步

[services.conversation.server]
address = "0.0.0.0"
port = 50090

# Prometheus 出口（共享运行时挂载；端口表见 deploy/prometheus.yml）。
[services.conversation.metrics]
address = "0.0.0.0"
port = 19190
