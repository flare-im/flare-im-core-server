# 示例：预置 Hook 配置
#
# 将本文件复制为 config/hooks.toml 后按需启用。
# 除 Hook 外，也可在同一个文件配置 capability 远程扩展插件发现与健康检查（见文件尾部）。

[[pre_send]]
name = "compliance-text-check"
type = "pre_send"
priority = 10
timeout_ms = 200
require_success = true

[pre_send.selector]
tenants = ["default"]
conversation_types = ["single_chat"]
message_types = ["text"]

[pre_send.transport]
type = "grpc"
endpoint = "https://hooks.internal.svc:7443"

[pre_send.metadata]
risk_level = "strict"

[[post_send]]
name = "audit-log-sink"
priority = 0
timeout_ms = 1000
require_success = false

[post_send.selector]
tenants = ["default"]

[post_send.transport]
type = "webhook"
endpoint = "https://audit.example.com/hooks/post_send"
secret = "replace-me"

[post_send.transport.headers]
X-Service = "flare-im-core"

[[delivery]]
name = "delivery-metrics"
priority = 0

[delivery.selector]
tenants = ["default"]

[delivery.transport]
type = "local"
target = "builtin_delivery_metrics"

[[recall]]
name = "recall-audit"
priority = 0

[recall.selector]
tenants = ["default"]

[recall.transport]
type = "grpc"
endpoint = "https://hooks.internal.svc:7443"

# -----------------------------------------------------------------------------
# Capability Runtime（扩展插件发现 / 健康检查 / 动态调用）
# -----------------------------------------------------------------------------
[capability_runtime]
# 可选：覆盖 dispatch 限制（与环境变量同名能力）
# max_payload_json_bytes = 1048576
# dispatch_timeout_ms = 25000
# dispatch_max_per_minute = 3000

# 扩展插件健康检查配置
plugin_health_check_interval_secs = 15
plugin_call_timeout_ms = 5000

[[capability_runtime.plugin_discovery_endpoints]]
tenant_id = "default"
plugin_id = "flare-strom-sfu"
capability_id = "rtc.media.control"
service_name = "flare-strom-sfu"
[capability_runtime.plugin_discovery_endpoints.labels]
module = "rtc"
backend = "strom-sfu"
# flare-capability 启动时会读取该条目并自动装配 remote RTC backend。

