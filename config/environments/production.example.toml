# 生产环境覆盖示例（不会被加载）。
# 加载器只读取 `environments/{FLARE_ENV}.toml`；本文件以 `.example.toml` 结尾，
# 因此设置 FLARE_ENV=production 不会让示例里的桶、CDN 与凭据占位覆盖 base.toml
# 的对象存储（取自 FLARE_S3_* 等环境变量）。需要生产覆盖时复制为 production.toml
# 并按部署填写，勿提交真实凭据。
# 仅支持 root [mq] 与 [object_storage.*]；完整服务覆盖请使用 config/overrides/*.toml。
# `${VAR}` 会在加载时展开，缺失则配置加载失败。

[object_storage.default]
profile_type = "s3"
access_key = "${AWS_ACCESS_KEY_ID}"
secret_key = "${AWS_SECRET_ACCESS_KEY}"
bucket = "flare-media-production"
region = "us-west-2"
cdn_base_url = "https://d1234567890.cloudfront.net"
