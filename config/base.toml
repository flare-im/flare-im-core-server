# Flare IM Core 基础配置

[service]
name = "flare-im-core"
version = "0.1.0"

[server]
address = "0.0.0.0"
port = 50051

[registry]
# 注册中心类型：etcd, consul, mesh
registry_type = "consul"
# 注册中心端点列表（Consul 默认端口 8500）
endpoints = ["http://localhost:28500"]
# 命名空间
namespace = "flare"
# TTL（秒）
ttl = 30
# 负载均衡策略：round_robin, random, consistent_hash, least_connections
# 默认：consistent_hash（一致性哈希，推荐用于网关路由）
load_balance_strategy = "consistent_hash"

[logging]
# 日志级别：trace, debug, info, warn, error
# 默认：debug（开发环境推荐，生产环境建议使用 info）
# 未设置环境变量 RUST_LOG 时生效；`scripts/start_server.sh` 默认会导出带 sqlx/tokio 等降噪的 RUST_LOG。
# 全链路排障可：`RUST_LOG=trace ./scripts/start_server.sh` 或第二参数 `trace`。
level = "debug"
# 是否显示目标模块名称
with_target = false
# 是否显示线程ID
with_thread_ids = true
# 是否显示文件名
with_file = true
# 是否显示行号
with_line_number = true

[mesh]
enabled = false
service_name = "flare-im-core"
namespace = "default"

[redis.conversation_store]
url = "redis://localhost:26379/0"
namespace = "flare:conversation"
ttl_seconds = 3600

[redis.token_store]
url = "redis://localhost:26379/1"
namespace = "flare:token"
ttl_seconds = 7200

[redis.media_metadata]
url = "redis://localhost:26379/2"
namespace = "flare:media"
ttl_seconds = 3600

[redis.upload_conversations]
url = "redis://localhost:26379/3"
namespace = "flare:media:upload"
ttl_seconds = 86400

[redis.message_wal]
url = "redis://localhost:26379/4"
namespace = "flare:message:wal"
ttl_seconds = 86400

[redis.push]
url = "redis://localhost:26379/5"
namespace = "flare:push"
ttl_seconds = 86400

[mq]
# 手动选择默认 MQ 实现（全小写）：
#   - "nats"：NATS JetStream
#   - "kafka"：Kafka（需配置下方 [kafka.message] / [kafka.push] 等；各二进制 wire 是否已接 Kafka 以代码为准）
#
# 覆盖优先级（高 → 低）：
#   1. 环境变量 FLARE_MQ_DEFAULT_BACKEND
#   2. config/environments/{FLARE_ENV}.toml 根级 [mq]（FLARE_ENV 未设时为 development）
#   3. 本文件此处
#
# 生产运行时 Kafka 与 JetStream 二选一，不做同链路双写。
default_backend = "nats"

# JetStream 事件总线：各服务通过 config/services/*.toml 引用 profile，Subject 见 flare_im_contracts::constants::topics
[jetstream.push]
url = "nats://127.0.0.1:24222"
client_id = "flare-im"
timeout_ms = 5000
retries = 8
retry_backoff_ms = 25
stream_name = "FLARE_PUSH"
subjects = ["flare.im.push.*"]
options = { retention = "limits", storage = "file", max_age_seconds = "86400", duplicate_window_seconds = "600", ack_wait_seconds = "30", max_deliver = "16" }

[jetstream.message]
url = "nats://127.0.0.1:24222"
client_id = "flare-message-orchestrator"
timeout_ms = 5000
retries = 8
retry_backoff_ms = 25
stream_name = "FLARE_MESSAGE"
subjects = ["flare.im.message.*", "flare.im.conversation.*"]
options = { retention = "limits", storage = "file", max_age_seconds = "604800", duplicate_window_seconds = "600", ack_wait_seconds = "30", max_deliver = "16" }

# Kafka 生产级推荐参数：仅在 mq.default_backend = "kafka" 时作为主 MQ 后端使用。
[kafka.message]
brokers = ["127.0.0.1:29092"]
client_id = "flare-im-message"
acks = "all"
# 本地默认使用 none，避免 librdkafka 未编译 zstd 支持时启动失败；生产环境可在确认镜像支持后改为 zstd/lz4/snappy。
compression = "none"
linger_ms = 5
batch_size_bytes = 1048576
message_timeout_ms = 30000
request_timeout_ms = 10000
enable_idempotence = true
max_in_flight_requests_per_connection = 5
replication_factor = 3
min_insync_replicas = 2
partitions = 256
retention_ms = 604800000
options = { "delivery.timeout.ms" = "30000", "retries" = "2147483647" }

[kafka.push]
brokers = ["127.0.0.1:29092"]
client_id = "flare-im-push"
acks = "all"
# 本地默认使用 none，避免 librdkafka 未编译 zstd 支持时启动失败；生产环境可在确认镜像支持后改为 zstd/lz4/snappy。
compression = "none"
linger_ms = 2
batch_size_bytes = 524288
message_timeout_ms = 15000
request_timeout_ms = 5000
enable_idempotence = true
max_in_flight_requests_per_connection = 5
replication_factor = 3
min_insync_replicas = 2
partitions = 512
retention_ms = 86400000
options = { "delivery.timeout.ms" = "15000", "retries" = "2147483647" }

# 消息/媒体/能力等共用 PostgreSQL（init_v2、storage、flare-capability 等均指向此库）
[postgres.media]
url = "postgres://flare:flare123@localhost:25432/flare2"
max_connections = 20
min_connections = 2
acquire_timeout_seconds = 10
idle_timeout_seconds = 300
max_lifetime_seconds = 1800

[postgres.storage_writer]
url = "postgres://flare:flare123@localhost:25432/flare2"
max_connections = 64
min_connections = 12
acquire_timeout_seconds = 5
idle_timeout_seconds = 300
max_lifetime_seconds = 1800

[postgres.storage_reader]
url = "postgres://flare:flare123@localhost:25432/flare2"
max_connections = 32
min_connections = 6
acquire_timeout_seconds = 5
idle_timeout_seconds = 300
max_lifetime_seconds = 1800

[postgres.conversation]
url = "postgres://flare:flare123@localhost:25432/flare2"
max_connections = 32
min_connections = 6
acquire_timeout_seconds = 5
idle_timeout_seconds = 300
max_lifetime_seconds = 1800

[postgres.media_metadata]
url = "postgres://flare:flare123@localhost:25432/flare2"
max_connections = 16
min_connections = 2
acquire_timeout_seconds = 10
idle_timeout_seconds = 300
max_lifetime_seconds = 1800

[postgres.capability]
url = "postgres://flare:flare123@localhost:25432/flare2"
max_connections = 12
min_connections = 2
acquire_timeout_seconds = 10
idle_timeout_seconds = 300
max_lifetime_seconds = 1800

# 对象存储配置 - 简化为单一配置，通过环境变量或部署时配置选择具体后端
# 默认使用 rusFS 对象存储配置
[object_storage.default]
profile_type = "s3"
endpoint = "http://127.0.0.1:29000"
access_key = "rustfsadmin"
secret_key = "rustfsadmin"
bucket = "flare-media"
region = "us-east-1"
use_ssl = false
cdn_base_url = "http://127.0.0.1:29000/flare-media"
# 预签名URL过期时间（秒），默认1小时
presign_url_ttl_seconds = 3600
use_presign = true
bucket_root_prefix = "media"
force_path_style = true

# MinIO 对象存储配置（备用）
[object_storage.minio]
profile_type = "minio"
endpoint = "http://127.0.0.1:29000"
access_key = "minioadmin"
secret_key = "minioadmin"
bucket = "flare-media"
region = "us-east-1"
use_ssl = false
cdn_base_url = "http://127.0.0.1:29000/flare-media"
# 预签名URL过期时间（秒），默认1小时
presign_url_ttl_seconds = 3600
use_presign = true
bucket_root_prefix = "media"
force_path_style = true

# 可选：如果需要多个对象存储配置，可以定义多个profile
# [object_storage.production]
# profile_type = "s3"
# access_key = "your-access-key"
# secret_key = "your-secret-key"
# bucket = "your-bucket-name"
# region = "us-west-2"
# presign_url_ttl_seconds = 3600
