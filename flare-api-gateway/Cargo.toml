[package]
name = "flare-api-gateway"
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
name = "flare_api_gateway"
path = "src/lib.rs"

[[bin]]
name = "flare-api-gateway"
path = "src/main.rs"

[dependencies]
# 内部依赖
flare-server-core = { workspace = true, features = ["http", "proto"] }
flare-core-runtime = { workspace = true }
flare-core-base = { workspace = true }
flare-im-service-kit = { workspace = true }
flare-im-contracts = { workspace = true }
flare-im-usage = { workspace = true }
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }

# 异步运行时
tokio = { workspace = true }
async-trait = { workspace = true }

# HTTP 框架
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# 日志追踪
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 工具库
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
futures = { workspace = true }
tokio-stream = { workspace = true }
reqwest = { workspace = true }

# 配置
dotenvy = "0.15"

# OpenAPI 文档
utoipa = "4"
utoipa-swagger-ui = { version = "4", features = ["axum"] }

# 验证

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# 契约测试：真实 Media gRPC 服务（内存端口）经公共 HTTP 路由读回，只在测试中使用。
flare-media = { path = "../flare-media" }

[lints]
workspace = true
