[package]
name = "flare-push-worker"
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flare-push-worker"
path = "cmd/main.rs"

[dependencies]
flare-server-core = { workspace = true, features = ["nats", "kafka"] }
flare-core-runtime = { workspace = true }
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-im-contracts = { workspace = true }
flare-im-service-kit = { workspace = true }
flare-im-usage = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# FCM HTTP v1 用服务账号 JWT 换 OAuth2 token
jsonwebtoken = { workspace = true, features = ["use_pem"] }
uuid = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
chrono = { workspace = true }
tonic = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# APNs 只接受 HTTP/2，必须显式开启该特性
reqwest = { workspace = true, features = ["http2"] }
redis = { workspace = true }
deadpool-redis = { workspace = true }

[dev-dependencies]
# 测试里为模拟的 broker 记录签发认证上下文（与 flare-im-service-kit 同一版本与特性）
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }

[lints]
workspace = true
