[package]
name = "flare-im-core-examples"
license.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
description = "flare-im-core 的可运行示例客户端"

# 这个包存在的唯一理由：让 `cargo run --example xxx` 真的能跑。
#
# 之前 examples/ 下只有裸 .rs 文件，既没有 Cargo.toml 也不是 workspace 成员，
# 于是 `cargo run --example chatroom_client` 会报
#   error: no example target named `chatroom_client` in default-run packages
# —— 而 start_server.sh 启动成功后打印的正是这条命令，scripts/start_client.sh
# 也调用它。也就是说，照着服务端自己的指引走，最后一步必然撞墙。
#
# 开源插件样例：独立进程、gRPC 接核心，演示 PreSend 的拒绝语义。
# 想写插件的人此前只有契约、没有能跑的起点。
[[example]]
name = "hook_rate_limit"
path = "hook_rate_limit.rs"

# 同上，但演示 PostSend：拿到的是既成事实，只能观察不能否决。
[[example]]
name = "hook_audit_log"
path = "hook_audit_log.rs"

[[example]]
name = "chatroom_client"
path = "chatroom_client.rs"

[[example]]
name = "business_push_client"
path = "business_push_client.rs"

[[example]]
name = "integration_client"
path = "integration_client.rs"

[[example]]
name = "complete_ack_example"
path = "complete_ack_example.rs"

[[example]]
name = "perf_message_send"
path = "perf_message_send.rs"

[dependencies]
flare-core = { workspace = true }
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-server-core = { workspace = true }
flare-core-base = { workspace = true }
flare-im-ack = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
tonic = { workspace = true }
prometheus = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }

[lints]
workspace = true
