[package]
name = "flare-storage-writer"
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flare-storage-writer"
path = "cmd/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
flare-server-core = { workspace = true, features = ["nats", "kafka"] }
flare-core-runtime = { workspace = true }
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-im-contracts = { workspace = true }
flare-im-service-kit = { workspace = true }
flare-im-usage = { workspace = true }
# 插件卡片的实体绑定：读插件目录投影里 message-content 贡献的 entityPath。
flare-im-capability-core = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# 只用于 tests/event_codec_contract.rs：Writer 编码、Reader 解码的往返契约。
flare-storage-reader = { path = "../reader" }
tokio-stream = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
prost-types = { workspace = true }
tracing-subscriber = { workspace = true }
prost = { workspace = true }

[lints]
workspace = true
