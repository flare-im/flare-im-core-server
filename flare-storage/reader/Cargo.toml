[package]
name = "flare-storage-reader"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flare-storage-reader"
path = "cmd/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
flare-server-core = { workspace = true, features = ["grpc", "discovery"] }
flare-core-runtime = { workspace = true }
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-im-contracts = { workspace = true }
flare-im-service-kit = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
prost-types = { workspace = true }
prost = { workspace = true }
# sqlx ConnectOptions::log_statements 的参数类型来自 log crate，仅此一处使用
log = "0.4"
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
redis = { workspace = true }
base64 = { workspace = true }
moka = { workspace = true, features = ["future"] }
prometheus = { workspace = true }

[dev-dependencies]
tokio-stream = { workspace = true }

[lints]
workspace = true
