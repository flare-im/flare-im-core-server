# flare-web 的共享路由。80 与 443 两个 server 块都 include 这一份，
# 避免两边各写一套后漂移（改了一边的超时/头，另一边悄悄不一致）。

    # SPA 路由：找不到文件交给 index.html，否则刷新子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 对象存储（预签名直传）──────────────────────────────────
    # 按桶名直挂根路径，不加 /storage 之类的前缀：S3 预签名的
    # Signature 覆盖完整 canonical URI，nginx 一旦剥掉前缀，rustfs 拿到的
    # 路径就和签名时的不一致，必然 403。proxy_pass 结尾不带 / 才会原样透传。
    #
    # Host 也必须原样转发：SignedHeaders 里含 host，改写它同样会让签名失配。
    # 同源还有个附带好处——浏览器直传不触发 CORS 预检。
    location /flare-media/ {
        proxy_pass http://127.0.0.1:29000;
        proxy_http_version 1.1;
        # 必须用 $http_host 而不是 $host：$host 会剥掉端口，而 SignedHeaders
        # 里含 host。预签名按 "118.107.9.221:80" 签，转发成 "118.107.9.221"
        # 就对不上，对象存储直接 403。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 媒体文件远大于 nginx 默认的 1m，超限会以 413 告终
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── WebSocket ────────────────────────────────────────────────
    # 必须显式升级协议；proxy_pass 结尾不加 / ，保留原始路径给后端。
    # 读写超时放到 1 小时：IM 连接的空闲时间远超 nginx 默认的 60s，
    # 用默认值会让长连接被静默掐断，表现为客户端莫名其妙重连。
    location /ws {
        proxy_pass http://127.0.0.1:60051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── HTTP API ─────────────────────────────────────────────────
    # 结尾的 / 会剥掉 /api 前缀再转发，后端拿到的是干净路径。
    location /api/ {
        proxy_pass http://127.0.0.1:50050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;
    }

    # WASM 必须带正确的 MIME，否则浏览器拒绝流式编译
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 带内容哈希的产物可以长缓存；index.html 绝不能缓存，
    # 否则发版后用户仍加载旧的 chunk 引用，白屏。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
