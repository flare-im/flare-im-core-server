# 80 端口复用：ssl_preread 只看 ClientHello 就能判断这条连接是不是 TLS，
# 不解密也不终止，据此转给回环上的明文或 TLS server。
#
# 为什么要这么干：云安全组只放行了 80，443 的 TCP 能连上但数据被静默丢弃
# （实测：connect 成功，TLS 握手 6 秒超时；服务器本机经公网 IP 访问 443 却是 200）。
# 而语音录制要求安全上下文，非 HTTPS 下 navigator.mediaDevices 直接不存在。
# 复用之后 https://118.107.9.221:80 可用——浏览器接受显式端口。
#
# 443 放开后：删掉本文件，并把 sites-available/flare-web 的两个 listen
# 改回 80 / 443 ssl，其余不动。
map $ssl_preread_protocol $flare_upstream {
    ""      127.0.0.1:8080;   # 不是 TLS → 明文 server
    default 127.0.0.1:8443;   # TLSv1.x → TLS server
}

server {
    listen 80 reuseport;
    ssl_preread on;
    proxy_protocol on;        # 保住客户端真实 IP，否则日志里全是 127.0.0.1
    proxy_pass $flare_upstream;
    proxy_timeout 3600s;      # IM 长连接，别用默认 10 分钟掐断
}
