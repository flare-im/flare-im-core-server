# QUIC 是 UDP，无法用 http 块代理，必须走 stream（4 层转发）。
#
# ⚠️ 4 层转发不解析内容，也就无法按路径路由 —— "/quic" 在 UDP 层并不存在。
# 前端把端点写成 quic://host/quic 只是与 /ws /api 保持形式统一，
# SDK 取的是 host 部分。
#
# 监听 60443 而不是 60052：服务端 QUIC 自己就绑在 60052，
# 同端口代理会自环。
server {
    listen 60443 udp reuseport;
    proxy_pass 127.0.0.1:60052;
    proxy_timeout 3600s;
}
