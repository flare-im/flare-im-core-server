networks:
  flare-network:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ===== Consul - 服务注册 / 配置中心 =====
  consul:
    image: hashicorp/consul:1.17
    container_name: flare-consul
    networks:
      - flare-network
    ports:
      - "28500:8500"   # Consul Web UI / API
      - "28600:8600/udp"  # DNS 解析
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - ./data/consul:/consul/data
      - ./consul-dev-limits.hcl:/consul/config/limits.hcl:ro
    command: >
      consul agent
      -server
      -ui
      -bootstrap-expect=1
      -client=0.0.0.0
      -bind=0.0.0.0
      -data-dir=/consul/data
      -config-file=/consul/config/limits.hcl
      -log-level=INFO

  # ===== Redis - 缓存 / 路由 =====
  # KV / 缓存后端：Dragonfly（多核 shard-per-thread、RESP 线协议兼容)。
  # 保留服务名 redis → 应用与各服务连接串不变;Dragonfly 单节点吃满所有核,消除 Redis
  # 单线程天花板(消息扇出/在线态/序列号/缓存共用的中枢不再受单核限制)。
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: flare-redis
    networks:
      - flare-network
    ports:
      - "26379:6379"
    volumes:
      - ./data/redis:/data
    ulimits:
      memlock: -1
    # 列表形式确保每个 flag 是独立 exec arg。maxmemory 6G;快照落同一挂载卷。
    # 如需认证:追加一行 - "--requirepass=你的密码"。
    command:
      - "--logtostderr"
      - "--maxmemory=6gb"
      - "--dir=/data"
      - "--dbfilename=dump"
      - "--snapshot_cron=*/5 * * * *"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== PostgreSQL + TimescaleDB - 主存储（消息/事件流/会话/媒体/Hook） =====
  # 当前本地开发/压测默认使用 SQL 事务 + TimescaleDB 时序能力承载 IM Core 主存储。
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flare-postgres
    networks:
      - flare-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flare123}
      POSTGRES_DB: ${POSTGRES_DB:-flare2}
    ports:
      - "25432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== rusFS - 对象存储 =====
  rustfs:
    image: rustfs/rustfs:latest
    container_name: flare-rustfs
    restart: always
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      # 用命名卷而不是 bind mount：容器内以 rustfs 用户运行，宿主机新建的目录
      # 属于另一个 UID，Linux 上的 Docker 会直接
      # `[FATAL] Server runtime failed: Io error: Permission denied`。
      # 本地 podman 是 rootless、有 UID 映射所以看不出来，CI 必然踩。
      # 对象存储的内部布局本来也不需要从宿主机翻看。
      - rustfs-data:/data
    command: [
      "--address", ":9000",
      "--console-address", ":9001",
      "--console-enable",
      "--access-key", "${RUSTFS_ACCESS_KEY:-rustfsadmin}",
      "--secret-key", "${RUSTFS_SECRET_KEY:-rustfsadmin}",
      "/data"
    ]
    healthcheck:
      # 没有健康检查时，`compose up --wait` 对它一无所知，崩溃循环也照样算「起来了」。
      # 不能用 curl -f：S3 对匿名的根访问返回 403，那是**正常**响应，
      # -f 会把它当失败，于是一个健康的服务被判成 unhealthy。
      # 这里只判断端点是否应答（连接被拒才算不健康）。
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  # 只有 rustfs 走命名卷（见上）。其余服务的 bind mount 保持不变，
  # 方便直接在宿主机上看数据。
  rustfs-data:
