networks:
  flare-network:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ===== Consul - 服务注册 / 配置中心 =====
  consul:
    image: hashicorp/consul:1.17
    container_name: flare-consul
    networks:
      - flare-network
    ports:
      - "28500:8500"   # Consul Web UI / API
      - "28600:8600/udp"  # DNS 解析
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - ./data/consul:/consul/data
      - ./consul-dev-limits.hcl:/consul/config/limits.hcl:ro
    command: >
      consul agent
      -server
      -ui
      -bootstrap-expect=1
      -client=0.0.0.0
      -bind=0.0.0.0
      -data-dir=/consul/data
      -config-file=/consul/config/limits.hcl
      -log-level=INFO

  # ===== Redis - 缓存 / 路由 =====
  redis:
    image: redis:7-alpine
    container_name: flare-redis
    networks:
      - flare-network
    ports:
      - "26379:6379"
    volumes:
      - ./data/redis:/data
    # REDIS_PASSWORD 留空 → 不启用认证（本地开发默认）；设了 → 服务端一并要求认证。
    # 只改连接串不改服务端，等于密码根本没生效——这里两边必须同源。
    command: >
      sh -c 'exec redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== PostgreSQL + TimescaleDB - 主存储（消息/事件流/会话/媒体/Hook） =====
  # 当前本地开发/压测默认使用 SQL 事务 + TimescaleDB 时序能力承载 IM Core 主存储。
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flare-postgres
    networks:
      - flare-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flare123}
      POSTGRES_DB: ${POSTGRES_DB:-flare2}
    ports:
      - "25432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Kafka - 消息队列（KRaft 无 Zookeeper） =====
  kafka:
    image: apache/kafka:3.7.0
    container_name: flare-kafka
    restart: always
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "29092:29092"

    environment:
      # JVM
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"

      # KRaft
      CLUSTER_ID: 4LZEfdh1SPSb9z7J1Hf0sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listener
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # 单节点必须
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

    volumes:
      - ./data/kafka:/var/lib/kafka/data

  # ===== Kafka topic 初始化 =====
  # Flare IM Core 运行时 Kafka / JetStream 二选一；本服务只在选择 Kafka 时用于预建 topic。
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: flare-kafka-init
    networks:
      - flare-network
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLARE_KAFKA_MESSAGE_PARTITIONS: "12"
      FLARE_KAFKA_PUSH_PARTITIONS: "12"
      FLARE_KAFKA_REPLICATION_FACTOR: "1"
      FLARE_KAFKA_MIN_INSYNC_REPLICAS: "1"
    volumes:
      - ./kafka-topics.sh:/opt/flare/kafka-topics.sh:ro
    command: ["/bin/bash", "/opt/flare/kafka-topics.sh"]
    restart: "no"
    logging: *default-logging

  # ===== NATS JetStream - 消息队列 =====
  nats:
    image: nats:2.10-alpine
    container_name: flare-nats
    restart: always
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "24222:4222"  # NATS client
      - "28222:8222"  # NATS monitoring
    command:
      # 超大群建群:首条消息携带整张成员表(10万≈1MB),需提高 NATS 单消息上限(默认 1MB)。
      # max_payload 只能经配置文件设置(无对应 CLI flag);data/nats/nats.conf 写 `max_payload: 16MB`。
      # 注:这是支撑"建群一次性大消息"的务实配置;生产更优解是服务端显式建群(消息不带成员表)。
      - "-c"
      - "/etc/nats/nats.conf"
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - ./data/nats:/data
      # 配置文件必须放在 ./data 之外：/deploy/data/ 整个被 .gitignore 忽略，
      # 放在里面时全新检出（CI、新机器）根本没有这个文件 —— NATS 启动即退，
      # 又因 restart: always 陷入崩溃循环，表现成「端口偶尔能连上但服务不在」。
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ===== rusFS - 对象存储 =====
  rustfs:
    image: rustfs/rustfs:latest
    container_name: flare-rustfs
    restart: always
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      # 用命名卷而不是 bind mount：容器内以 rustfs 用户运行，宿主机新建的目录
      # 属于另一个 UID，Linux 上的 Docker 会直接
      # `[FATAL] Server runtime failed: Io error: Permission denied`。
      # 本地 podman 是 rootless、有 UID 映射所以看不出来，CI 必然踩。
      # 对象存储的内部布局本来也不需要从宿主机翻看。
      - rustfs-data:/data
    command: [
      "--address", ":9000",
      "--console-address", ":9001",
      "--console-enable",
      "--access-key", "${RUSTFS_ACCESS_KEY:-rustfsadmin}",
      "--secret-key", "${RUSTFS_SECRET_KEY:-rustfsadmin}",
      "/data"
    ]
    healthcheck:
      # 没有健康检查时，`compose up --wait` 对它一无所知，崩溃循环也照样算「起来了」。
      # 不能用 curl -f：S3 对匿名的根访问返回 403，那是**正常**响应，
      # -f 会把它当失败，于是一个健康的服务被判成 unhealthy。
      # 这里只判断端点是否应答（连接被拒才算不健康）。
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== Loki - 日志聚合 =====
  loki:
    image: grafana/loki:2.9.4
    container_name: flare-loki
    networks:
      - flare-network
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===== Prometheus - 监控 =====
  prometheus:
    image: prom/prometheus:latest
    container_name: flare-prometheus
    networks:
      - flare-network
    ports:
      - "29090:9090"
    volumes:
      - ./data/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Tempo - 分布式追踪 =====
  tempo:
    image: grafana/tempo:latest
    container_name: flare-tempo
    networks:
      - flare-network
    ports:
      - "3200:3200"   # Tempo API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Grafana - 可视化与告警 =====
  grafana:
    image: grafana/grafana:latest
    container_name: flare-grafana
    networks:
      - flare-network
    depends_on:
      - loki
      - prometheus
      - tempo
    ports:
      - "23000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # 只有 rustfs 走命名卷（见上）。其余服务的 bind mount 保持不变，
  # 方便直接在宿主机上看数据。
  rustfs-data:
