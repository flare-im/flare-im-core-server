networks:
  flare-network:
    driver: bridge

services:
  # ===== Consul - 服务注册 / 配置中心 =====
  consul:
    image: hashicorp/consul:1.17
    container_name: flare-consul
    networks:
      - flare-network
    ports:
      - "28500:8500"   # Consul Web UI / API
      - "28600:8600/udp"  # DNS 解析
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - ./data/consul:/consul/data
      - ./consul-dev-limits.hcl:/consul/config/limits.hcl:ro
    command: >
      consul agent
      -server
      -ui
      -bootstrap-expect=1
      -client=0.0.0.0
      -bind=0.0.0.0
      -data-dir=/consul/data
      -config-file=/consul/config/limits.hcl
      -log-level=INFO

  # ===== Redis - 缓存 / 路由 =====
  redis:
    image: redis:7-alpine
    container_name: flare-redis
    networks:
      - flare-network
    ports:
      - "26379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== PostgreSQL + TimescaleDB - 主存储（消息/事件流/会话/媒体/Hook） =====
  # 当前本地开发/压测默认使用 SQL 事务 + TimescaleDB 时序能力承载 IM Core 主存储。
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flare-postgres
    networks:
      - flare-network
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: flare123
      POSTGRES_DB: flare2
    ports:
      - "25432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Kafka - 消息队列（KRaft 无 Zookeeper） =====
  kafka:
    image: apache/kafka:3.7.0
    container_name: flare-kafka
    restart: always
    networks:
      - flare-network
    ports:
      - "29092:29092"

    environment:
      # JVM
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"

      # KRaft
      CLUSTER_ID: 4LZEfdh1SPSb9z7J1Hf0sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listener
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # 单节点必须
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

    volumes:
      - ./data/kafka:/var/lib/kafka/data

  # ===== Kafka topic 初始化 =====
  # Flare IM Core 运行时 Kafka / JetStream 二选一；本服务只在选择 Kafka 时用于预建 topic。
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: flare-kafka-init
    networks:
      - flare-network
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLARE_KAFKA_MESSAGE_PARTITIONS: "12"
      FLARE_KAFKA_PUSH_PARTITIONS: "12"
      FLARE_KAFKA_REPLICATION_FACTOR: "1"
      FLARE_KAFKA_MIN_INSYNC_REPLICAS: "1"
    volumes:
      - ./kafka-topics.sh:/opt/flare/kafka-topics.sh:ro
    command: ["/bin/bash", "/opt/flare/kafka-topics.sh"]
    restart: "no"

  # ===== NATS JetStream - 消息队列 =====
  nats:
    image: nats:2.10-alpine
    container_name: flare-nats
    restart: always
    networks:
      - flare-network
    ports:
      - "24222:4222"  # NATS client
      - "28222:8222"  # NATS monitoring
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - ./data/nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ===== rusFS - 对象存储 =====
  rustfs:
    image: rustfs/rustfs:latest
    container_name: flare-rustfs
    restart: always
    networks:
      - flare-network
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./data/rustfs:/data
    command: [
      "--address", ":9000",
      "--console-address", ":9001",
      "--console-enable",
      "--access-key", "rustfsadmin",
      "--secret-key", "rustfsadmin",
      "/data"
    ]

  # ===== Loki - 日志聚合 =====
  loki:
    image: grafana/loki:2.9.4
    container_name: flare-loki
    networks:
      - flare-network
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===== Prometheus - 监控 =====
  prometheus:
    image: prom/prometheus:latest
    container_name: flare-prometheus
    networks:
      - flare-network
    ports:
      - "29090:9090"
    volumes:
      - ./data/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Tempo - 分布式追踪 =====
  tempo:
    image: grafana/tempo:latest
    container_name: flare-tempo
    networks:
      - flare-network
    ports:
      - "3200:3200"   # Tempo API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Grafana - 可视化与告警 =====
  grafana:
    image: grafana/grafana:latest
    container_name: flare-grafana
    networks:
      - flare-network
    depends_on:
      - loki
      - prometheus
      - tempo
    ports:
      - "23000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
