# Optional local observability stack.
#
# Add this file only when logs, metrics, traces, or dashboards are needed:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

services:
  # ===== Loki - 日志聚合 =====
  loki:
    image: grafana/loki:2.9.4
    container_name: flare-loki
    networks:
      - flare-network
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===== Prometheus - 监控 =====
  prometheus:
    image: prom/prometheus:latest
    container_name: flare-prometheus
    networks:
      - flare-network
    ports:
      - "29090:9090"
    volumes:
      - ./data/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Tempo - 分布式追踪 =====
  tempo:
    image: grafana/tempo:latest
    container_name: flare-tempo
    networks:
      - flare-network
    ports:
      - "3200:3200"   # Tempo API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Grafana - 可视化与告警 =====
  grafana:
    image: grafana/grafana:latest
    container_name: flare-grafana
    networks:
      - flare-network
    depends_on:
      - loki
      - prometheus
      - tempo
    ports:
      - "23000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  flare-network:
    external: false
