global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'flare-im'
    replica: '0'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Flare IM Core 已实际启动 /metrics 的服务。目标名使用
  # docker-compose.stack.yml 的服务名；端口与 config/services/*.toml 一致。
  # 其他服务接入 serve_prometheus_metrics 后再增加抓取目标。
  - job_name: 'message-ingest'
    static_configs:
      - targets: ['message-ingest:19180']
        labels:
          service: 'message-ingest'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'message-orchestrator'
    static_configs:
      - targets: ['orchestrator:19181']
        labels:
          service: 'message-orchestrator'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'storage-writer'
    static_configs:
      - targets: ['storage-writer:19182']
        labels:
          service: 'storage-writer'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Signaling Gateway 目前以 ACCESS_GATEWAY_METRICS_PORT 默认监听 19183。
  - job_name: 'access-gateway'
    static_configs:
      - targets: ['signaling-gateway:19183']
        labels:
          service: 'access-gateway'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Push Worker 的入口已配置，但 SEC-07 事件来源门禁未解除时进程默认暂停。
  - job_name: 'push-worker'
    static_configs:
      - targets: ['push-worker:19186']
        labels:
          service: 'push-worker'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # 中间件服务 —— 只抓取有 /metrics HTTP 端点的服务
  # jetstream/redis/postgres 使用自有协议，不能直接 scrape，
  # 需要单独的 exporter（如 jetstream_exporter、redis_exporter、postgres_exporter）

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
