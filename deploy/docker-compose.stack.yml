# Full Flare IM Core stack from a prebuilt image — no Rust toolchain required.
#
#   export FLARE_TOKEN_SECRET="$(openssl rand -base64 48 | tr -d '\n' | head -c 64)"
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.stack.yml up -d
#
# The infrastructure (Postgres / NATS / Consul / Redis / RustFS) comes from
# docker-compose.yml; this file adds the Flare services on top. Keeping them in two files
# means you can still run the infra alone when developing against a locally built binary.
#
# One image serves every service — they differ only by which binary runs, so twelve
# near-identical images would multiply registry size and version skew for nothing.

# 容器日志默认无上限。线上跑了几周后 /var/lib/docker/containers 吃掉 3.8G，
# 单个服务的 json.log 到 1.7G——磁盘打满会让整套部署一起挂，而且事前没有任何信号。
# 一次投递失败的重试风暴就能在几分钟内写出几万行。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-flare-service: &flare-service
  image: ${FLARE_IMAGE:-ghcr.io/flare-im/flare-im-core:latest}
  restart: unless-stopped
  networks: [flare-network]
  logging: *default-logging
  environment: &flare-env
    RUST_LOG: ${RUST_LOG:-info}
    # 名字必须是 FLARE_CONFIG_PATH（service-kit 的 runtime.rs 读的是它）。
    # 曾写成 FLARE_CONFIG_DIR —— 没有任何代码读那个名字，服务会回退到相对 CWD 的
    # config/，容器里不存在，于是集体「postgres config is required」启动失败。
    FLARE_CONFIG_PATH: /etc/flare/config
    # All three gateways must validate against the same secret the client signs with.
    # No default on purpose: a shipped default secret is a shipped vulnerability —
    # anyone holding it can forge any user's identity against any deployment that
    # forgot to change it. Compose fails loudly if FLARE_TOKEN_SECRET is unset.
    FLARE_API_GATEWAY_TOKEN_SECRET: ${FLARE_TOKEN_SECRET:?set FLARE_TOKEN_SECRET to a strong secret of 32+ bytes}
    ACCESS_GATEWAY_TOKEN_SECRET: ${FLARE_TOKEN_SECRET:?set FLARE_TOKEN_SECRET to a strong secret of 32+ bytes}
    FLARE_ADMIN_GATEWAY_TOKEN_SECRET: ${FLARE_TOKEN_SECRET:?set FLARE_TOKEN_SECRET to a strong secret of 32+ bytes}
    # Inside the compose network services reach each other by service name on the
    # container-internal port, not through the host-side mapping.
    CONSUL_HTTP_ADDR: http://consul:8500
    # 凭据从 .env 拼装，与基础设施那份 compose 读同一批变量——改一处即可。
    #
    # 库名此前写死成 `/flare`，而基础设施建的是 `flare2`（config/base.toml 的默认值
    # 也是 flare2）。这一栈从没真正起来过（镜像未发布），所以这个错一直没暴露：
    # 服务会连上实例、然后找不到库。
    #
    # 便捷路径按上面几个变量拼；密码里有 @ : / 或空格会拼坏 URL（compose 不做百分号
    # 转义），所以留了直接覆盖的口子：在 .env 里设 DATABASE_URL 就整条照用。
    # deploy/up.sh 会在走便捷路径时校验密码是否 URL 安全，早报错好过连不上瞎猜。
    DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-flare}:${POSTGRES_PASSWORD:-flare123}@postgres:5432/${POSTGRES_DB:-flare2}}
    # REDIS_PASSWORD 留空就是无密码（本地默认）；设了则连接串带上它。
    REDIS_URL: ${REDIS_URL:-redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379}
    NATS_URL: nats://nats:4222
    #
    # 上面三个只有 flare-capability 读（DATABASE_URL）。**其余 14 个服务的中间件地址
    # 来自 config/base.toml**，此前是硬编码的 localhost:25432 那一套——也就是说这一栈
    # 即使起来了，14 个服务也会去连自己容器的 localhost。这个错一直没暴露，因为镜像
    # 从未发布、这份 compose 从未真正跑过。
    #
    # 现在 base.toml 用 ${VAR:-本机默认值} 写中间件地址：不设就是本机那套（开发行为
    # 一字不变），容器里由下面这几个变量覆盖成服务名。
    FLARE_POSTGRES_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-flare}:${POSTGRES_PASSWORD:-flare123}@postgres:5432/${POSTGRES_DB:-flare2}}
    FLARE_REDIS_URL_BASE: ${REDIS_URL:-redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379}
    FLARE_NATS_URL: nats://nats:4222
    FLARE_KAFKA_BROKERS: kafka:9092
    FLARE_S3_ENDPOINT: http://rustfs:9000
    FLARE_CONSUL_ENDPOINT: http://consul:8500
  depends_on:
    consul: {condition: service_started}
    postgres: {condition: service_started}
    nats: {condition: service_started}
    redis: {condition: service_started}

services:
  # ── Ingress ────────────────────────────────────────────────────────────────
  api-gateway:
    <<: *flare-service
    environment:
      <<: *flare-env
      # 注册进 Consul 的对外地址。绑的是 0.0.0.0，而登记 127.0.0.1 在容器里
      # 指向服务自己——注册成功、健康检查也过，跨服务调用却全部 tcp connect error。
      SERVICE_ADVERTISE_HOST: api-gateway
    command: ["flare-api-gateway"]
    ports: ["50050:50050"]

  signaling-gateway:
    <<: *flare-service
    environment:
      <<: *flare-env
      # 注册进 Consul 的对外地址。绑的是 0.0.0.0，而登记 127.0.0.1 在容器里
      # 指向服务自己——注册成功、健康检查也过，跨服务调用却全部 tcp connect error。
      SERVICE_ADVERTISE_HOST: signaling-gateway
    command: ["flare-signaling-gateway"]
    # The long-connection port clients actually dial
    ports: ["60051:60051"]

  admin-gateway:
    <<: *flare-service
    environment:
      <<: *flare-env
      # 注册进 Consul 的对外地址。绑的是 0.0.0.0，而登记 127.0.0.1 在容器里
      # 指向服务自己——注册成功、健康检查也过，跨服务调用却全部 tcp connect error。
      SERVICE_ADVERTISE_HOST: admin-gateway
    command: ["flare-admin-gateway"]

  # ── Signaling ──────────────────────────────────────────────────────────────
