[package]
name = "flare-im-service-kit"
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
name = "flare_im_service_kit"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
dashmap = "6.0"
dotenvy = "0.15"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
etcd-client = { workspace = true }
flare-core = { workspace = true }
flare-core-base = { workspace = true }
flare-core-runtime = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-im-contracts = { version = "1.0.3", path = "../flare-im-contracts" }
flare-proto = { workspace = true }
flare-server-core = { workspace = true, features = ["proto", "discovery", "grpc", "nats"] }
futures = { workspace = true }
hex = { workspace = true }
# 静态 gRPC 通道自带连接器，让 tonic 的建连超时同时覆盖名字解析（见 discovery::channel_resolve）。
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
moka = { workspace = true }
once_cell = { workspace = true }
# process：Linux 上默认注册表自带进程指标（CPU、RSS、fd、线程数），/metrics 合并默认注册表导出。
prometheus = { workspace = true, features = ["process"] }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
# 进程内共享的 Redis 连接（见 redis_connection）：有界建连、应答与重建。
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }

[features]
default = []
discovery = []

[lints.rust]
async_fn_in_trait = "allow"
ambiguous_glob_reexports = "allow"
