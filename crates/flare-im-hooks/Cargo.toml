[package]
name = "flare-im-hooks"
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
name = "flare_im_hooks"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
flare-core-base = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-im-contracts = { version = "1.0.3", path = "../flare-im-contracts" }
flare-im-service-kit = { version = "1.0.3", path = "../flare-im-service-kit", features = ["discovery"] }
flare-proto = { workspace = true }
flare-server-core = { workspace = true, features = ["proto", "grpc"] }
once_cell = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints.rust]
async_fn_in_trait = "allow"
