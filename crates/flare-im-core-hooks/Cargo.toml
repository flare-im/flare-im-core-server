[package]
name = "flare-im-core-hooks"
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
name = "flare_im_core_hooks"
path = "src/lib.rs"

[dependencies]
# 配置放在原子指针后面：发送路径一次读取，热加载时整体换。
arc-swap = "1"
async-trait = { workspace = true }
base64 = { workspace = true }
flare-core-base = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-im-core-contracts = { version = "1.0.3", path = "../flare-im-core-contracts" }
flare-im-core-service-kit = { version = "1.0.3", path = "../flare-im-core-service-kit", features = ["discovery"] }
flare-proto = { workspace = true }
flare-server-core = { workspace = true, features = ["proto", "grpc"] }
once_cell = { workspace = true }
prometheus = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints.rust]
async_fn_in_trait = "allow"
