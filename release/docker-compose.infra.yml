networks:
  flare-network:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  consul:
    image: hashicorp/consul:1.17
    container_name: flare-consul
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "127.0.0.1:28500:8500"
      - "127.0.0.1:28600:8600/udp"
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - ./data/consul:/consul/data
    command: >
      consul agent
      -server
      -ui
      -bootstrap-expect=1
      -client=0.0.0.0
      -bind=0.0.0.0
      -data-dir=/consul/data
      -log-level=WARN
    mem_limit: 256m

  # KV / 缓存后端：Dragonfly(多核 shard-per-thread、RESP 线协议兼容)。
  # 保留服务名 redis → 各服务连接串零改动;单节点吃满所有核,消除单聊/群扇出/在线态/
  # 序列号/缓存共用的单线程 Redis 中枢瓶颈(Redis 单线程只能吃 1 核)。
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: flare-redis
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - ./data/redis:/data
    ulimits:
      memlock: -1
    # ⚠️ seq 高水位安全(承接原 volatile-lru + AOF 的意图,方式更优):
    #   - 混存两类键:带 TTL 的缓存/幂等键、**不带 TTL 的会话 seq 高水位**(seq:<tenant>:<conv>)。
    #   - Dragonfly 默认 noeviction(不开 --cache_mode)→ 内存满时写 OOM、**不淘汰任何键**,
    #     无 TTL 的 seq 键**永不被淘汰**(强于 redis volatile-lru;后者仍会淘汰有 TTL 的键)。
    #   - Dragonfly 无 AOF、用快照(--snapshot_cron);seq 另有 allocate_seq_with_floor 从 PG 存储
    #     max 自愈(见 memory seq-floor-self-heal),KV 丢 seq 可恢复,快照+自愈双兜底。
    #   - maxmemory 显著低于 mem_limit(默认 1792m/2560m=70%),留缓冲余量;Dragonfly shard-per-thread
    #     无 Redis 的单进程 BGSAVE fork 尖峰问题,旧 RDB fork OOM 事故不复存在。
    command:
      - "--logtostderr"
      - "--maxmemory=${REDIS_MAXMEMORY:-1792mb}"
      - "--dir=/data"
      - "--dbfilename=dump"
      - "--snapshot_cron=${REDIS_SNAPSHOT_CRON:-*/2 * * * *}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEM_LIMIT:-2560m}

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flare-postgres
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flare123}
      POSTGRES_DB: ${POSTGRES_DB:-flare2}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - postgres
      - -c
      # base.toml 里六个连接池的上限合计 176，业务栈（flare-social 七个服务）再要 ~50。
      # 这里原本写死 80，一套完整部署跑起来必然耗尽连接：表现是发消息静默失败，
      # 而服务端日志里 seq 已经分配完、outcome=ok，极具误导性。
      # scripts/check_pg_connection_budget.sh 会守住这个不等式。
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      # 内存参数按机器规格由 scripts/plan_mem_budget.py 计算(物理内存/核数 → 最优 mem_limit
      # + shared_buffers/effective_cache_size 等),部署时写进 .env 覆盖下面的默认。默认值是
      # 中档基线(约 8-16G 机型)。effective_cache_size 是规划器提示、不占 RAM,应反映整机
      # 可缓存量(shared_buffers + 内核页缓存,取物理内存 ~60%)——只按 shared_buffers 估会
      # 严重低估、让规划器错选顺序扫。
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-768MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-9600MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-32MB}
      - -c
      # WAL 压缩:减少 WAL I/O(pglz),CPU 开销可忽略。
      - wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
      - -c
      # pg_stat_statements:慢查询定位的唯一手段(与 timescaledb 一起预加载)。
      - shared_preload_libraries=${POSTGRES_SHARED_PRELOAD_LIBRARIES:-timescaledb,pg_stat_statements}
    healthcheck:
      # 必须带 -d：pg_isready 不指定库时默认连**与用户同名**的库（flare），
      # 而实际库是 flare2 → 每次探测都在 postgres 日志里留一条
      # `FATAL: database "flare" does not exist`（10s 一条）。探测本身仍会
      # 报 healthy（连得上服务端就算通），所以问题只表现为日志噪声——
      # 但它会淹没真正的数据库错误。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flare} -d ${POSTGRES_DB:-flare2}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 300 连接 × ~2MB + shared_buffers 768MB + maintenance 256MB,3072m 足够;
    # 更大机型经 .env 提额(见 scripts/plan_mem_budget.py 按物理内存计算)。
    mem_limit: ${POSTGRES_MEM_LIMIT:-3072m}

  nats:
    image: nats:2.10-alpine
    container_name: flare-nats
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    environment:
      # nats.conf 用 $$VAR 展开，NATS 对未定义的变量会启动失败，所以默认值必须在这里给。
      NATS_MAX_FILE_STORE: ${NATS_MAX_FILE_STORE:-10GB}
      NATS_MAX_MEM_STORE: ${NATS_MAX_MEM_STORE:-256MB}
    ports:
      - "127.0.0.1:24222:4222"
      - "127.0.0.1:28222:8222"
    command:
      - "-c"
      - "/etc/nats/nats.conf"
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - ./data/nats:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ⚠️ 铁律：NATS_MAX_MEM_STORE 必须显著小于这里的 mem_limit。
    # JetStream 会按配额去涨，而这个配额只覆盖内存流，连接缓冲与 file-store
    # 索引都不算在内——配额贴着容器上限就等于安排一次 OOM。
    #
    # 线上事故：部署侧把 NATS_MAX_MEM_STORE 调成 2G 而这里还是 384m，
    # nats-server 被 cgroup OOM 杀了 34 次（dmesg: CONSTRAINT_MEMCG,
    # anon-rss 恰好 384MB）。默认 256MB 配 1g，留约 4 倍余量。
    mem_limit: 1g

  rustfs:
    image: rustfs/rustfs:latest
    container_name: flare-rustfs
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./data/rustfs:/data
    command:
      - "--address"
      - ":9000"
      - "--console-address"
      - ":9001"
      - "--console-enable"
      - "--access-key"
      - "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      - "--secret-key"
      - "${RUSTFS_SECRET_KEY:-rustfsadmin}"
      - "/data"
    mem_limit: 512m

  # 升级用的数据库补丁执行器。
  # init.sql 走 postgres 的 docker-entrypoint-initdb.d，**只在数据目录为空时**执行一次；
  # 已经在跑的部署升级到新版本后，新增的列永远不会补上，且失败形态是运行期 500
  # （曾经线上 list_conversations 因为缺 visible_from_seq 整体报错，实时投递静默失效）。
  # 这些补丁全部是 ADD COLUMN IF NOT EXISTS，可以每次启动都跑。
  db-migrate:
    image: timescale/timescaledb:latest-pg16
    container_name: flare-db-migrate
    networks:
      - flare-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-flare123}
    volumes:
      - ./sql/patches:/patches:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /patches/*.sql; do
          [ -e "$$f" ] || continue
          echo "applying $$f"
          psql -h postgres -U "${POSTGRES_USER:-flare}" -d "${POSTGRES_DB:-flare2}" \
               -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "db patches applied"
    restart: "no"
