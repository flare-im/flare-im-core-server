networks:
  flare-network:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  consul:
    image: hashicorp/consul:1.17
    container_name: flare-consul
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "127.0.0.1:28500:8500"
      - "127.0.0.1:28600:8600/udp"
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - ./data/consul:/consul/data
    command: >
      consul agent
      -server
      -ui
      -bootstrap-expect=1
      -client=0.0.0.0
      -bind=0.0.0.0
      -data-dir=/consul/data
      -log-level=WARN
    mem_limit: 192m

  redis:
    image: redis:7-alpine
    container_name: flare-redis
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - ./data/redis:/data
    # ⚠️ 策略必须是 volatile-lru，不能是 allkeys-lru。
    #
    # 这个 Redis 里混着两类键：
    #   - 带 TTL 的缓存/幂等键（线上 1954 个键里 1922 个属于此类）
    #   - **不带 TTL 的会话 seq 高水位**（seq:<tenant>:<conversation>）
    #
    # allkeys-lru 在内存吃紧时会连后者一起淘汰。seq 键一旦被淘汰，下一条消息的
    # INCR 从 1 重新开始——会话 seq 大幅回退，新消息被排到时间线中间，而且是
    # **永久错乱**、刷新也不会好。本仓历史上真出过这个故障。
    #
    # volatile-lru 只淘汰有 TTL 的键，正好就是那些可再生的缓存；
    # 不选 noeviction 是因为它会在压力下让写入直接失败，可用性更差。
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save ""
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 512mb
      --maxmemory ${REDIS_MAXMEMORY:-900mb}
      --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ⚠️ 周期性 RDB 快照必须关掉（--save ""），由 AOF everysec 承担持久化。
    # 线上事故：默认的 `save 60 10000` 让 Redis 每约 75 秒 BGSAVE 一次，
    # fork 出一个约等于数据集大小的进程，写入期间 COW 页累积把 cgroup 顶爆，
    # redis-server 被 OOM 杀掉、重启加载 RDB 7 秒，期间全服务 BusyLoadingError，
    # 用户表现是发消息失败（allocate seq failed ... broken pipe）。
    # AOF 重写按增长触发（翻倍且 >512mb），fork 频率远低于每 60 秒一次。
    #
    # 另：切换到 AOF 前必须确认 appendonlydir 不是陈旧的——本次切换时 Redis
    # 从 14 小时前的旧 AOF 加载，键数 173 万→2.5 万，seq 高水位随之回退并撞号。
    #
    # maxmemory 必须显著低于 mem_limit（约 59%，不是 80%）：Redis 的实际 RSS
    # 高于 used_memory（实测碎片率 1.12），复制缓冲与客户端输出缓冲也不计入
    # maxmemory。线上 1200mb/1536m（78%）这一档被 cgroup OOM 杀过。
    #
    # 线上事故：384mb/512m 这档在真实数据量下顶满，累计驱逐 103,716 个 key。
    # 被 volatile-lru 丢掉的是 seq 高水位、在线索引、幂等键这类 IM 状态，
    # 后果是"新消息排进历史中间"这类不易归因的问题，且全程无告警。
    mem_limit: ${REDIS_MEM_LIMIT:-1536m}

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flare-postgres
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flare123}
      POSTGRES_DB: ${POSTGRES_DB:-flare2}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - postgres
      - -c
      # base.toml 里六个连接池的上限合计 176，业务栈（flare-social 七个服务）再要 ~50。
      # 这里原本写死 80，一套完整部署跑起来必然耗尽连接：表现是发消息静默失败，
      # 而服务端日志里 seq 已经分配完、outcome=ok，极具误导性。
      # scripts/check_pg_connection_budget.sh 会守住这个不等式。
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1024MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_buffers=16MB
    healthcheck:
      # 必须带 -d：pg_isready 不指定库时默认连**与用户同名**的库（flare），
      # 而实际库是 flare2 → 每次探测都在 postgres 日志里留一条
      # `FATAL: database "flare" does not exist`（10s 一条）。探测本身仍会
      # 报 healthy（连得上服务端就算通），所以问题只表现为日志噪声——
      # 但它会淹没真正的数据库错误。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flare} -d ${POSTGRES_DB:-flare2}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 300 个连接 × 每连接约 2MB + shared_buffers 256MB，1280m 不够。
    mem_limit: ${POSTGRES_MEM_LIMIT:-2048m}

  nats:
    image: nats:2.10-alpine
    container_name: flare-nats
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    environment:
      # nats.conf 用 $$VAR 展开，NATS 对未定义的变量会启动失败，所以默认值必须在这里给。
      NATS_MAX_FILE_STORE: ${NATS_MAX_FILE_STORE:-10GB}
      NATS_MAX_MEM_STORE: ${NATS_MAX_MEM_STORE:-256MB}
    ports:
      - "127.0.0.1:24222:4222"
      - "127.0.0.1:28222:8222"
    command:
      - "-c"
      - "/etc/nats/nats.conf"
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - ./data/nats:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ⚠️ 铁律：NATS_MAX_MEM_STORE 必须显著小于这里的 mem_limit。
    # JetStream 会按配额去涨，而这个配额只覆盖内存流，连接缓冲与 file-store
    # 索引都不算在内——配额贴着容器上限就等于安排一次 OOM。
    #
    # 线上事故：部署侧把 NATS_MAX_MEM_STORE 调成 2G 而这里还是 384m，
    # nats-server 被 cgroup OOM 杀了 34 次（dmesg: CONSTRAINT_MEMCG,
    # anon-rss 恰好 384MB）。默认 256MB 配 1g，留约 4 倍余量。
    mem_limit: 1g

  rustfs:
    image: rustfs/rustfs:latest
    container_name: flare-rustfs
    restart: unless-stopped
    logging: *default-logging
    networks:
      - flare-network
    ports:
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./data/rustfs:/data
    command:
      - "--address"
      - ":9000"
      - "--console-address"
      - ":9001"
      - "--console-enable"
      - "--access-key"
      - "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      - "--secret-key"
      - "${RUSTFS_SECRET_KEY:-rustfsadmin}"
      - "/data"
    mem_limit: 384m

  # 升级用的数据库补丁执行器。
  # init.sql 走 postgres 的 docker-entrypoint-initdb.d，**只在数据目录为空时**执行一次；
  # 已经在跑的部署升级到新版本后，新增的列永远不会补上，且失败形态是运行期 500
  # （曾经线上 list_conversations 因为缺 visible_from_seq 整体报错，实时投递静默失效）。
  # 这些补丁全部是 ADD COLUMN IF NOT EXISTS，可以每次启动都跑。
  db-migrate:
    image: timescale/timescaledb:latest-pg16
    container_name: flare-db-migrate
    networks:
      - flare-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-flare123}
    volumes:
      - ./sql/patches:/patches:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /patches/*.sql; do
          [ -e "$$f" ] || continue
          echo "applying $$f"
          psql -h postgres -U "${POSTGRES_USER:-flare}" -d "${POSTGRES_DB:-flare2}" \
               -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "db patches applied"
    restart: "no"
