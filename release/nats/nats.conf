max_payload: 16MB

# JetStream 落盘配额。
# 这里曾经写死 1GB，是开发机档位：核心流 FLARE_MESSAGE 只有 7 天时限、没有字节上限，
# 一套真实部署跑几周就把 1GB 占满，之后所有 publish 返回
# `insufficient resources (10023)`，conversation.ensure 发不出去 → 会话不物化 →
# 发消息整体 fail-closed。没有任何告警，表现只是"消息一直转圈发不出去"。
# 用 .env 里的 NATS_MAX_FILE_STORE / NATS_MAX_MEM_STORE 按机器磁盘调整。
jetstream {
  max_mem_store: $NATS_MAX_MEM_STORE
  max_file_store: $NATS_MAX_FILE_STORE
}
