[package]
name = "flare-sync-orchestrator"
version.workspace = true
edition.workspace = true

[features]
default = []
proto = ["flare-server-core/proto"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "flare-sync-orchestrator"
path = "cmd/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
flare-server-core = { workspace = true, features = ["discovery", "proto"] }
flare-core-runtime = { workspace = true }
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-im-contracts = { workspace = true }
flare-im-service-kit = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
redis = { workspace = true }
