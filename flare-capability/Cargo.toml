[package]
name = "flare-capability"
version.workspace = true
edition.workspace = true
description = "Flare IM 能力服务：Hook 引擎调度 + 能力扩展协议/适配 + gRPC 服务入口"

[lib]
name = "flare_capability"
path = "src/lib.rs"

[[bin]]
name = "flare-capability"
path = "cmd/main.rs"

[dependencies]
flare-im-contracts = { workspace = true }
flare-im-service-kit = { workspace = true }
flare-im-hooks = { workspace = true }
flare-im-capability-core = { workspace = true }
flare-core-base = { version = "1.0.3", path = "../../flare-server-core/flare-core-base" }
# NOTE: 能力侧仅保留远端媒体控制 gRPC 适配；核心不内嵌具体媒体后端实现。
flare-proto = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-server-core = { workspace = true, features = ["grpc", "discovery"] }
flare-core-runtime = { workspace = true }

tokio = { workspace = true }

tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

reqwest = { workspace = true }

hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

sqlx = { workspace = true }

async-trait = { workspace = true }
futures-util = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

etcd-client = { workspace = true }

dashmap = "6.0"
subtle = "2.6"
[dev-dependencies]
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }
prost-types = { workspace = true }

[features]
default = ["backend-remote"]
backend-remote = ["flare-grpc-proto/sfu_control"]

[lints]
workspace = true
