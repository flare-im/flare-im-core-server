[package]
name = "flare-admin-gateway"
license.workspace = true
version.workspace = true
edition.workspace = true

[[bin]]
name = "flare-admin-gateway"
path = "src/main.rs"

[lib]
name = "flare_admin_gateway"
path = "src/lib.rs"

[dependencies]
flare-core-runtime = { workspace = true }
flare-im-service-kit = { workspace = true }
tonic = { workspace = true }
flare-core-base = { workspace = true }
flare-grpc-proto = { workspace = true }
flare-proto = { workspace = true }
flare-server-core = { workspace = true }
flare-plugin-protocol = { version = "0.1.0", path = "../../flare-proto/flare-plugin-protocol" }

anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
# Plugin admin pages carry plugin-defined JSON input and data.
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = "4"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
